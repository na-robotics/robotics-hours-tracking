<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d2328">
<title>Lab Hours — Admin</title>
<!-- Icons only: the service worker is registered by the tablet page, so a
     browser that only ever opens this page is never served a cached shell. -->
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Display + text faces. Cross-origin, so the service worker never caches
     them; on a dead network the fallback stacks in styles.css take over and
     the layout holds. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
<style>
  /* The tablet page is sized to be read across a room. This one is a dense
     desktop report, so it steps the type back down and reuses only the tokens. */
  :root {
    /* Validated against the #262d33 chart surface: inside the dark-mode
       lightness band and over 3:1 contrast. --out-bright is the obvious pick
       from the shared tokens but sits too light against the panel once bars
       are 2.75rem wide and read as a solid field. */
    --chart-bar: #4f9fd4;
  }
  /* styles.css pins html/body to 100% height for the tablet's fixed, unscrollable
     surface. This page is a long report, so hand scrolling back to the document
     instead of trapping it in an inner body scroller. */
  html, body { height: auto; min-height: 100%; }
  body { font-size: 15px; }
  .wrap { max-width: 78rem; margin: 0 auto; padding: 1.75rem 1.5rem 6rem; }

  /* ---- chrome ----
     The topbar is the machine's faceplate: a darker band than the report
     under it, with a hairline seam and no shadow. */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    padding: 0.75rem 1.5rem;
    background: rgba(23, 28, 32, 0.93);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .topbar__title {
    margin: 0; font-family: var(--font-display);
    font-size: 1.4rem; font-weight: 700; letter-spacing: 0.01em;
    padding-right: 0.75rem; border-right: 1px solid var(--border);
  }
  .topbar__spacer { flex: 1; }

  /* Tabs are cut into the faceplate: the selected one is lit from beneath by
     a signal underline rather than by a filled pill, which keeps five of them
     from reading as five buttons. */
  .tabs { display: flex; gap: 0.15rem; }
  .tab {
    position: relative;
    min-height: 2.5rem; padding: 0 0.85rem;
    border: 0; border-radius: 0;
    background: transparent; color: var(--text-dim);
    font-family: var(--font-display); font-size: 1.0625rem; font-weight: 600;
    letter-spacing: 0.01em; cursor: pointer;
  }
  .tab:hover { color: var(--text); }
  .tab::after {
    content: ""; position: absolute; left: 0.4rem; right: 0.4rem; bottom: -0.78rem;
    height: 2px; background: transparent;
  }
  .tab[aria-selected="true"] { color: var(--text); }
  .tab[aria-selected="true"]::after { background: var(--out-bright); }
  .tab:focus-visible { outline: 2px solid var(--warn-bright); outline-offset: -2px; }

  /* The shared .btn is sized for a finger on a wall tablet. This page is
     driven with a mouse, so every control steps down to a desktop scale and
     square-cut corners; .btn-sm is the row-level variant inside tables. */
  .btn {
    min-height: 2.5rem; padding: 0 1rem;
    font-size: 1.0625rem; border-radius: var(--radius-data);
  }
  .btn-sm {
    min-height: 2.25rem; padding: 0 0.85rem;
    font-size: 0.9375rem;
  }

  /* ---- controls row ---- */
  .controls {
    display: flex; align-items: flex-end; gap: 0.75rem; flex-wrap: wrap;
    margin: 1.5rem 0 1rem;
  }
  .control { display: flex; flex-direction: column; gap: 0.3rem; }
  .control__label { font-size: 0.8125rem; font-weight: 500; color: var(--text-dim); }
  .input {
    min-height: 2.5rem; padding: 0 0.7rem;
    border: 1px solid var(--border); border-radius: var(--radius-data);
    background: var(--bg-sunken); color: var(--text);
    font: inherit;
  }
  .input:focus { outline: none; border-color: var(--out-bright); box-shadow: inset 0 0 0 1px var(--out-bright); }
  .input--search { min-width: 18rem; }
  .presets { display: flex; gap: 0.25rem; }

  /* ---- tables ----
     A timesheet is read down a column, so the rules run horizontally only and
     the header is a fixed rail rather than a card. */
  .table-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 0.4rem; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 0.6rem 1rem; text-align: left; white-space: nowrap; }
  thead th {
    position: sticky; top: 0;
    background: var(--bg-sunken);
    font-family: var(--font-display); font-size: 0.9375rem; font-weight: 600;
    letter-spacing: 0.02em; color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }
  thead th.sortable { cursor: pointer; user-select: none; }
  thead th.sortable:hover { color: var(--text); }
  th.num, td.num { text-align: right; }
  tbody tr { border-top: 1px solid rgba(58, 68, 76, 0.55); }
  tbody tr:hover { background: rgba(98, 182, 232, 0.06); }
  tbody tr.clickable { cursor: pointer; }
  tfoot td {
    border-top: 1px solid var(--border); background: var(--bg-sunken);
    font-family: var(--font-display); font-size: 1.05rem; font-weight: 700;
  }
  .name-cell { font-weight: 600; }
  .muted { color: var(--text-dim); }
  /* Rename and Archive sit side by side; keep them on one line per row.
     This is a div inside the cell, never the <td> itself — a td with
     display:flex stops being a table cell and the columns stop lining up. */
  .row-actions { display: flex; gap: 0.4rem; align-items: center; white-space: nowrap; }
  .name-cell #rename-input { min-width: 12rem; font-weight: 600; }
  .detail-head h2 #rename-input { font-size: 1.25rem; min-width: 16rem; }

  /* ---- status pills. Colour never carries meaning alone: each pill has a word. ---- */
  .pill {
    display: inline-flex; align-items: center; gap: 0.4em;
    padding: 0.15em 0.55em;
    border: 1px solid currentColor; border-radius: var(--radius-data);
    font-size: 0.8125rem; font-weight: 600; white-space: nowrap;
  }
  .pill--in     { background: rgba(78, 208, 138, 0.1); color: var(--in-bright); }
  .pill--review { background: rgba(232, 163, 43, 0.1); color: var(--warn-bright); }
  .pill--error  { background: rgba(242, 112, 94, 0.1); color: var(--error-bright); }
  .pill--quiet  { background: transparent; color: var(--text-dim); border-color: var(--border); }

  .live-dot {
    width: 0.5em; height: 0.5em; border-radius: 50%;
    background: var(--in-bright);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* ---- stat tiles ----
     Not cards: figures ruled off from each other by a single seam, so a row
     of them reads as one instrument panel instead of four boxes. */
  .tiles {
    display: grid; gap: 0;
    grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
    margin: 1.25rem 0;
    border: 1px solid var(--border); border-radius: 0.4rem;
    background: var(--bg-raised);
    overflow: hidden;
  }
  .tile { padding: 0.9rem 1.1rem; border-left: 1px solid var(--border); }
  .tile:first-child { border-left: 0; }
  .tile__label { font-size: 0.8125rem; font-weight: 500; color: var(--text-dim); }
  .tile__value {
    margin-top: 0.15rem; font-family: var(--font-display);
    font-size: 2.25rem; font-weight: 700; line-height: 1.05;
    letter-spacing: 0.005em; font-variant-numeric: tabular-nums;
  }
  .tile__value small { font-size: 0.95rem; font-weight: 600; color: var(--text-dim); }

  /* ---- bar chart: one series, so no legend; the heading names it ---- */
  .chart-card { padding: 1.25rem; border: 1px solid var(--border); border-radius: 0.4rem; background: var(--bg-raised); }
  .chart-card h3 { margin: 0 0 0.15rem; font-size: 1.2rem; font-weight: 600; }
  .chart-card p.muted { margin: 0 0 1.25rem; font-size: 0.875rem; }
  .chart { position: relative; }
  .chart__plot {
    position: relative;
    display: flex; align-items: flex-end; gap: 2px;   /* 2px surface gap between bars */
    height: 200px;
    padding-left: 3rem;
    border-bottom: 1px solid var(--border);
  }
  .chart__grid { position: absolute; inset: 0 0 0 3rem; pointer-events: none; }
  .chart__gridline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); opacity: 0.4; }
  .chart__gridlabel {
    position: absolute; right: calc(100% + 0.5rem); transform: translateY(-50%);
    font-size: 0.75rem; color: var(--text-dim); font-variant-numeric: tabular-nums;
  }
  .chart__col {
    position: relative; flex: 1 1 0; min-width: 6px; height: 100%;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .chart__bar {
    /* Capped and centred: with only a handful of weeks, full-width bars butt up
       against each other and a run of them reads as one solid block. */
    width: 100%; max-width: 2.75rem;
    background: var(--chart-bar);
    border-radius: 2px 2px 0 0;      /* squared data-end, anchored to the baseline */
    transition: filter 120ms;
  }
  .chart__col:hover .chart__bar { filter: brightness(1.25); }
  .chart__bar--empty { background: var(--border); min-height: 2px; border-radius: 0; }
  .chart__peak {
    position: absolute; bottom: calc(var(--h) + 6px); left: 50%; transform: translateX(-50%);
    font-family: var(--font-display); font-size: 0.85rem; font-weight: 700;
    white-space: nowrap; color: var(--text);
  }
  .chart__axis { display: flex; gap: 2px; padding-left: 3rem; margin-top: 0.4rem; }
  .chart__tick {
    flex: 1 1 0; min-width: 6px; text-align: center;
    font-size: 0.6875rem; color: var(--text-dim); white-space: nowrap; overflow: hidden;
  }
  .chart__tip {
    position: absolute; z-index: 3; pointer-events: none;
    padding: 0.5rem 0.7rem; border: 1px solid var(--border); border-radius: var(--radius-data);
    background: var(--bg-sunken); font-size: 0.8125rem; line-height: 1.4;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); white-space: nowrap;
  }
  .chart__tip strong { display: block; font-family: var(--font-display); font-size: 1rem; }

  /* ---- session list ---- */
  .session {
    display: grid; align-items: center; gap: 0.75rem;
    grid-template-columns: 8.5rem 1fr auto auto;
    padding: 0.65rem 1rem;
    border-top: 1px solid rgba(58, 68, 76, 0.55);
  }
  .session:first-child { border-top: 0; }
  /* A session that needs a human wears the caution rail, and nothing else does. */
  .session--problem { box-shadow: inset 0.25rem 0 0 var(--warn-bright); background: rgba(232, 163, 43, 0.05); }
  .session__date { font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; }
  .session__times { color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .session__dur { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .session__actions { display: flex; gap: 0.4rem; }
  .session__editor {
    grid-column: 1 / -1;
    display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: flex-end;
    padding: 0.9rem; margin-top: 0.5rem;
    border: 1px solid var(--border); border-radius: var(--radius-data); background: var(--bg-sunken);
  }
  .confirm__actions { margin-left: auto; display: flex; gap: 0.5rem; flex-shrink: 0; }
  .confirm {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
    padding: 0.75rem 0.9rem; margin-top: 0.5rem;
    border: 1px solid var(--error); border-left: 0.3rem solid var(--error-bright);
    border-radius: 0 var(--radius-data) var(--radius-data) 0;
    background: rgba(155, 44, 34, 0.14);
  }
  .btn-danger { background: var(--error); border-color: var(--error-bright); color: #fdeeeb; }

  /* ---- flagged review queue ---- */
  .chips { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .chip {
    min-height: 2.25rem; padding: 0 0.85rem;
    border: 1px solid var(--border); border-radius: var(--radius-data);
    background: transparent; color: var(--text-dim);
    font-family: var(--font-display); font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--bg-raised); color: var(--text); border-color: var(--out-bright); }
  .chip__n { opacity: 0.65; margin-left: 0.4em; font-variant-numeric: tabular-nums; }
  .who-link {
    display: block; margin-top: 0.15rem; padding: 0;
    background: none; border: 0; color: var(--out-bright);
    font: inherit; font-size: 0.875rem; font-weight: 600; text-align: left; cursor: pointer;
  }
  .who-link:hover { text-decoration: underline; }
  .tab__count {
    display: inline-block; min-width: 1.4em; margin-left: 0.35em; padding: 0.05em 0.35em;
    border-radius: var(--radius-data); background: var(--warn); color: #fff;
    font-family: var(--font); font-size: 0.75rem; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* ---- summaries ----
     A student's own writing, so it is the one place on this page set for
     reading: a measured line length, looser leading, and a blue rail marking
     it as quoted rather than computed. */
  .summary {
    padding: 1rem 1.25rem;
    border-top: 1px solid var(--border);
    border-left: 0.3rem solid var(--out-bright);
    background: rgba(98, 182, 232, 0.045);
  }
  .summary__head { display: flex; gap: 0.6rem; align-items: baseline; flex-wrap: wrap; margin-bottom: 0.5rem; }
  .summary__label { font-family: var(--font-display); font-weight: 600; color: var(--out-bright); font-size: 1rem; }
  .summary__text { margin: 0; max-width: 68ch; white-space: pre-wrap; line-height: 1.65; overflow-wrap: anywhere; }
  .summary__photos { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.85rem; }
  .summary__photo {
    display: block; width: 7rem; height: 7rem; border-radius: var(--radius-data); overflow: hidden;
    border: 1px solid var(--border); background: var(--bg-sunken);
  }
  .summary__photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .summary__photo--broken {
    display: flex; align-items: center; justify-content: center; padding: 0.4rem;
    font-size: 0.75rem; text-align: center; color: var(--out-bright);
  }

  /* ---- misc ---- */
  .card { border: 1px solid var(--border); border-radius: 0.4rem; background: var(--bg-raised); }
  .banner {
    display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
    padding: 0.85rem 1.1rem; margin-bottom: 1rem;
    border: 1px solid var(--error); border-left: 0.3rem solid var(--error-bright);
    border-radius: 0 var(--radius-data) var(--radius-data) 0;
    background: rgba(155, 44, 34, 0.14);
  }
  /* ---- optimistic-write chrome ----
     Both of these are deliberately quiet. The point of optimistic updates is
     that the coach never waits, so anything that flashes, blocks or disables a
     control would put the waiting back. */
  .saving {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.8125rem; color: var(--text-dim);
  }
  .saving__dot {
    width: 0.45rem; height: 0.45rem; border-radius: 50%;
    background: var(--text-dim); animation: saving-pulse 1s ease-in-out infinite;
  }
  @keyframes saving-pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .saving__dot { animation: none; opacity: 0.7; }
  }

  .toasts {
    position: fixed; z-index: 20;
    left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 1.25rem);
    display: flex; flex-direction: column; gap: 0.5rem;
    width: min(32rem, calc(100vw - 2rem));
    pointer-events: none;
  }
  .toast {
    pointer-events: auto;
    display: flex; align-items: flex-start; gap: 0.75rem;
    padding: 0.8rem 1rem;
    border: 1px solid var(--border); border-left: 0.3rem solid var(--error-bright);
    border-radius: 0 var(--radius-data) var(--radius-data) 0;
    background: var(--bg-raised);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    font-size: 0.9rem;
  }
  .toast__msg { flex: 1; line-height: 1.5; }
  .toast__close {
    background: none; border: 0; color: var(--text-dim);
    font-size: 1.1rem; line-height: 1; cursor: pointer; padding: 0 0.2rem;
  }

  /* An empty view is an invitation, so it gets room rather than a shrug. */
  .empty { padding: 3.5rem 1rem; text-align: center; color: var(--text-dim); }

  /* The gate is the only full-screen moment this page has: the panel is
     centred on the ground with the app's name set at display size above it. */
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
  .gate__card {
    width: min(24rem, 100%);
    display: flex; flex-direction: column; gap: 0.9rem;
    padding: 2.25rem 2rem 2rem;
    overflow: hidden;
  }
  .gate h1 { margin: 0; font-size: 2rem; font-weight: 700; line-height: 1; }
  .back {
    display: inline-flex; align-items: center; gap: 0.4rem;
    background: none; border: 0; padding: 0.5rem 0;
    color: var(--out-bright); font: inherit; font-weight: 600; cursor: pointer;
  }
  .detail-head { display: flex; align-items: flex-start; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
  .detail-head h2 { margin: 0; font-size: 2rem; font-weight: 700; line-height: 1.05; }
  .row-gap { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .add-form { display: flex; gap: 0.75rem; align-items: flex-end; flex-wrap: wrap; padding: 1rem; margin-bottom: 1rem; }
  .email-cell { max-width: 15rem; }

  /* Teams ---------------------------------------------------------------- */
  .pill--team { background: rgba(98, 182, 232, 0.1); color: var(--out-bright); }
  .team-cell { white-space: nowrap; }

  /* The hours bar in the team table: a ranking read across rows, so it is
     scaled to the largest team rather than to a round axis. The number sits on
     top of it, because the bar answers "who is doing the most" and the figure
     answers "how much". */
  .teambar {
    position: relative;
    display: flex; align-items: center;
    min-width: 9rem; height: 1.65rem;
    padding: 0 0.5rem;
    border-radius: 2px;
    background: var(--bg-sunken);
    overflow: hidden;
  }
  .teambar__fill {
    position: absolute; inset: 0 auto 0 0;
    background: var(--out); opacity: 0.7;
  }
  .teambar__value {
    position: relative;
    font-family: var(--font-display); font-size: 1.05rem;
    font-weight: 700; font-variant-numeric: tabular-nums;
  }

  /* The member strip under each team row. It is a continuation of the row
     above, so it loses the top border that would read as a new row. */
  .team-row--members td {
    border-top: 0;
    padding-top: 0;
    display: flex; flex-wrap: wrap; gap: 0.15rem 0.75rem;
  }
  .team-row--unassigned { opacity: 0.78; }

  .picker {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
    gap: 0.15rem;
    max-height: 20rem; overflow-y: auto;
    padding: 0.5rem;
    border: 1px solid var(--border); border-radius: var(--radius-data);
    background: var(--bg-sunken);
  }
  .picker__item {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.35rem 0.5rem;
    border-radius: 2px;
    cursor: pointer;
  }
  .picker__item:hover { background: rgba(255, 255, 255, 0.045); }
  .picker__item--on { background: rgba(98, 182, 232, 0.14); }
  .picker__team { margin-left: auto; font-size: 0.8125rem; }
  .email-cell__value {
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 0.875rem;
  }
  /* ---- Rejected hours ---- */
  .reject-group { margin-bottom: 1rem; }
  .reject-group__head {
    display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
    padding: 0.65rem 1rem; border-bottom: 1px solid var(--border);
    background: var(--bg-sunken);
  }
  .reject-group__name { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; }
  .reject-row {
    display: grid; gap: 0.75rem; align-items: center; padding: 0.65rem 1rem;
    grid-template-columns: auto 9rem 5rem 1fr auto;
    border-bottom: 1px solid rgba(58, 68, 76, 0.55);
  }
  .reject-row:last-child { border-bottom: 0; }
  .reject-row__reason { font-size: 0.875rem; color: var(--text-dim); }
  /* The bulk bar acts on hours that are currently not counting, so it carries
     the caution stripe — the second and last place on the page that does. */
  .bulkbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
    padding: 0.85rem 1rem 0.65rem; margin-bottom: 1rem;
    border: 1px solid var(--border); border-radius: var(--radius-data);
    background: var(--bg-raised);
    overflow: hidden;
  }
  .bulkbar::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0;
    height: 0.3rem; background: var(--hazard);
  }
  @media (max-width: 720px) {
    .reject-row { grid-template-columns: auto 1fr auto; }
    .reject-row__reason { grid-column: 1 / -1; }
  }
  [hidden] { display: none !important; }
</style>
</head>

<body data-palette="#4f9fd4">

<!-- PIN gate ------------------------------------------------------------- -->
<div class="gate" id="gate">
  <div class="card gate__card">
    <h1>Lab Hours</h1>
    <p class="muted" style="margin:0">Coaches only. If you have lost the PIN, it is in the Config tab of the sheet.</p>
    <label class="visually-hidden" for="pin">Admin PIN</label>
    <input class="input" id="pin" type="password" inputmode="numeric" placeholder="PIN"
           autocomplete="off" enterkeyhint="go">
    <p class="muted" id="gate-msg" style="margin:0;min-height:1.4em"></p>
    <button class="btn btn--primary" id="unlock" type="button">Unlock</button>
  </div>
</div>

<!-- App ------------------------------------------------------------------ -->
<div id="app" hidden>
  <header class="topbar">
    <h1 class="topbar__title">Lab Hours</h1>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-roster" role="tab" aria-selected="true">Roster</button>
      <button class="tab" id="tab-teams" role="tab" aria-selected="false">Teams</button>
      <button class="tab" id="tab-timesheet" role="tab" aria-selected="false">Timesheet</button>
      <button class="tab" id="tab-flagged" role="tab" aria-selected="false">Needs review<span class="tab__count" id="flag-count" hidden></span></button>
      <button class="tab" id="tab-rejected" role="tab" aria-selected="false">Rejected hours<span class="tab__count" id="rejected-count" hidden></span></button>
    </div>
    <span class="topbar__spacer"></span>
    <!-- Unobtrusive on purpose. A write is in flight, the interface stays
         live, and this is the only thing that moves. -->
    <span class="saving" id="saving" hidden><span class="saving__dot"></span>Saving…</span>
    <span class="muted" id="freshness" style="font-size:0.875rem"></span>
    <button class="btn btn--ghost btn-sm" id="refresh" type="button">Refresh</button>
    <button class="btn btn--ghost btn-sm" id="lock" type="button">Lock</button>
  </header>

  <main class="wrap">
    <div class="banner" id="banner" hidden>
      <span id="banner-msg"></span>
      <button class="btn btn--ghost btn-sm" id="banner-retry" type="button">Retry</button>
    </div>
    <div id="view"></div>
  </main>

  <!-- Failed writes land here. A rolled-back change has already vanished from
       the table by the time this appears, so it has to say what was undone. -->
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>

<script type="module">
import * as api from './js/api.js';
import { ApiError } from './js/api.js';

// ---------------------------------------------------------------------------
// State
//
// Everything on this page is derived from two fetches made once at unlock:
// the roster (so students with no events still appear, and so we know who is
// archived) and the FULL timesheet with no date range. Filtering, totals,
// averages, weekly buckets and the chart are all computed here from that one
// session list. Nothing is stored back to the Sheet, and no view triggers a
// per-student request.
// ---------------------------------------------------------------------------

const $ = (id) => document.getElementById(id);

const state = {
  pin: sessionStorage.getItem('lab.admin.pin') || '',
  students: [],
  // Sessions that COUNT: active and recovered. Rejected ones are kept apart in
  // state.rejected rather than filtered at each call site, so every total,
  // average, chart bucket and CSV column on this page is correct without
  // knowing the rule exists. This split in load() is the one place it is
  // applied — the mirror of resolveEvents_() on the server.
  sessions: [],
  rejected: [],
  gracePeriodHours: 24,
  byStudent: new Map(),
  studentById: new Map(),
  summariesByStudent: new Map(),
  // Teams are roster data, not attendance data: a student's hours do not move
  // when their team does, so nothing here is derived from the event log. The
  // list rides along on getRoster; teamsSupported goes false against a backend
  // deployed before teams existed, and the whole feature hides itself rather
  // than erroring.
  teams: [],
  teamsSupported: true,
  loadedAt: null,
  summariesError: null,
  view: 'roster',          // 'roster' | 'teams' | 'timesheet' | 'flagged' | 'rejected' | 'detail'
  detailId: null,
  search: '',
  from: '',
  to: '',
  showInactive: false,
  teamFilter: 'all',       // 'all' | 'unassigned' | a team_id — applies to every list view
  sort: { key: 'name', dir: 1 },
  teamSort: { key: 'hours', dir: -1 },
  flagFilter: 'all',
  editing: null,           // session key being edited
  confirming: null,        // session key awaiting delete confirmation
  adding: false,
  addingSession: false,    // the manual session-entry form is open
  renaming: null,          // student_id whose name is being edited
  editingEmail: null,      // student_id whose email is being edited
  editingTeam: null,       // student_id whose team picker is open
  renamingTeam: null,      // team_id whose name is being edited
  addingTeam: false,       // the new-team form is open
  confirmingTeam: null,    // team_id awaiting delete confirmation
  assignTeamId: '',        // the team the bulk assigner will move people to
  assignSearch: '',        // the assigner's own name filter, kept out of the shared search
  selectedStudents: new Set(),   // student ids ticked in the bulk assigner
  selectedRejected: new Set(),   // session keys ticked for bulk recovery
  busy: false,
};

// ---------------------------------------------------------------------------
// Formatting
// ---------------------------------------------------------------------------

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function fmtHours(minutes) {
  if (minutes == null) return '—';
  return (Math.round(minutes / 6) / 10).toFixed(1);
}

function fmtDur(minutes) {
  if (minutes == null) return '—';
  if (minutes < 60) return minutes + 'm';
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  return m ? h + 'h ' + m + 'm' : h + 'h';
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
}

function fmtTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function fmtWhen(iso) {
  if (!iso) return '—';
  return fmtDate(iso) + ', ' + fmtTime(iso);
}

/** YYYY-MM-DD of the Monday that starts the week containing d. */
function weekStart(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}

function dateKey(d) {
  const pad = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

function toLocalInput(iso) {
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
         'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

// A session's identity for UI bookkeeping. Event ids change whenever a
// correction supersedes one, so this is only ever used within a single render.
const sessionKey = (s) => (s.in_event_id || '') + '|' + (s.out_event_id || '');

// ---------------------------------------------------------------------------
// Stats — all computed from the session list, never read from the Sheet
// ---------------------------------------------------------------------------

/**
 * A session counts toward totals only when it is well formed. The backend marks
 * anything else — an IN with no OUT, an OUT with no IN, an inverted pair — with
 * needs_review and a null duration, and those rows are reported separately
 * rather than folded into an average that would quietly be wrong.
 */
function statsFor(sessions) {
  const closed = sessions.filter((s) => s.status === 'closed' && typeof s.minutes === 'number');
  const totalMinutes = closed.reduce((sum, s) => sum + s.minutes, 0);

  let longest = null, shortest = null;
  for (const s of closed) {
    if (longest === null || s.minutes > longest) longest = s.minutes;
    if (shortest === null || s.minutes < shortest) shortest = s.minutes;
  }

  const stamps = sessions.map((s) => s.out_time || s.in_time).filter(Boolean).sort();

  return {
    totalMinutes,
    count: closed.length,
    average: closed.length ? Math.round(totalMinutes / closed.length) : null,
    longest,
    shortest,
    perWeek: sessionsPerWeek(closed),
    problems: sessions.filter((s) => s.needs_review).length,
    flagged: sessions.filter((s) => s.flagged).length,
    open: sessions.find((s) => s.status === 'open') || null,
    lastSeen: stamps.length ? stamps[stamps.length - 1] : null,
  };
}

function sessionsPerWeek(closed) {
  if (!closed.length) return null;
  const times = closed.map((s) => new Date(s.in_time).getTime());
  const spanDays = (Math.max(...times) - Math.min(...times)) / 86400000 + 1;
  return Math.round((closed.length / Math.max(1, spanDays / 7)) * 10) / 10;
}

/** Minutes a still-open session has run, computed live in the browser. */
function openMinutes(session) {
  return Math.max(0, Math.round((Date.now() - new Date(session.in_time).getTime()) / 60000));
}

/** Hours per week, with empty weeks kept so the time axis stays continuous. */
function weeklyHours(sessions) {
  const closed = sessions.filter((s) => s.status === 'closed' && typeof s.minutes === 'number');
  if (!closed.length) return [];

  const buckets = new Map();
  for (const s of closed) {
    const key = dateKey(weekStart(new Date(s.in_time)));
    const bucket = buckets.get(key) || { minutes: 0, sessions: 0 };
    bucket.minutes += s.minutes;
    bucket.sessions += 1;
    buckets.set(key, bucket);
  }

  const keys = [...buckets.keys()].sort();
  const out = [];
  const cursor = new Date(keys[0] + 'T00:00:00');
  const last = new Date(keys[keys.length - 1] + 'T00:00:00');
  while (cursor <= last) {
    const key = dateKey(cursor);
    const bucket = buckets.get(key) || { minutes: 0, sessions: 0 };
    out.push({
      key,
      label: cursor.toLocaleDateString([], { month: 'short', day: 'numeric' }),
      hours: bucket.minutes / 60,
      minutes: bucket.minutes,
      sessions: bucket.sessions,
    });
    cursor.setDate(cursor.getDate() + 7);
  }
  return out;
}

// ---------------------------------------------------------------------------
// Selectors
// ---------------------------------------------------------------------------

/** Sessions inside the chosen date range. Range is inclusive, local days. */
function inRange(sessions) {
  return sessions.filter((s) => {
    if (state.from && s.date < state.from) return false;
    if (state.to && s.date > state.to) return false;
    return true;
  });
}

function sessionsOf(studentId) {
  return state.byStudent.get(studentId) || [];
}

function summariesOf(studentId) {
  return state.summariesByStudent.get(studentId) || [];
}

/**
 * Sessions and summaries in one newest-first list, so a writeup sits directly
 * under the session it describes. A summary is pinned to the start of its own
 * day, which puts it below that day's sessions in a descending list — and a
 * summary written for a day with no recorded lab time still shows up.
 */
function timelineFor(studentId) {
  const items = sessionsOf(studentId).map((session) => ({
    kind: 'session', at: session.in_time || session.out_time, session,
  }));
  for (const summary of summariesOf(studentId)) {
    items.push({ kind: 'summary', at: (summary.session_date || '') + 'T00:00:01', summary });
  }
  return items.sort((a, b) => String(b.at).localeCompare(String(a.at)));
}

/**
 * Drive's uc?export=view links are unreliable inside an <img>. The file id is
 * the durable part, so pull it out and use the thumbnail endpoint for display
 * and the file viewer for full size.
 */
function driveId(url) {
  const m = /[?&]id=([A-Za-z0-9_-]+)/.exec(url) || /\/d\/([A-Za-z0-9_-]+)/.exec(url);
  return m ? m[1] : null;
}

/**
 * Every session that wants a human look, newest first.
 *
 * Deliberately ignores the timesheet's date range: this is a review queue, and
 * a filter that quietly hides a broken session from three weeks ago is how a
 * broken session survives to the end of the season.
 */
function flaggedSessions() {
  const term = state.search.trim().toLowerCase();
  return state.sessions
    .filter((s) => s.flagged || s.needs_review)
    .filter((s) => flagCategories(s).includes(state.flagFilter) || state.flagFilter === 'all')
    .filter((s) => matchesTeamId(s.student_id))
    .filter((s) => !term || String(s.name || '').toLowerCase().includes(term) || s.student_id.includes(term))
    .sort((a, b) => String(b.in_time || b.out_time).localeCompare(String(a.in_time || a.out_time)));
}

/** Why a session is in the queue. A session can be in more than one bucket. */
function flagCategories(s) {
  const sources = s.sources || [];
  const out = [];
  if (s.needs_review) out.push('review');
  if (sources.includes('auto-close')) out.push('auto');
  if (sources.includes('offline')) out.push('offline');
  if (sources.includes('admin')) out.push('admin');
  if (sources.includes('manual')) out.push('manual');
  return out;
}

function flagCounts() {
  const counts = { all: 0, review: 0, auto: 0, offline: 0, admin: 0, manual: 0 };
  for (const s of state.sessions) {
    if (!s.flagged && !s.needs_review) continue;
    counts.all++;
    for (const c of flagCategories(s)) counts[c]++;
  }
  return counts;
}

function rangeLabel() {
  if (!state.from && !state.to) return 'All time';
  if (state.from && state.to) return fmtDate(state.from + 'T12:00') + ' – ' + fmtDate(state.to + 'T12:00');
  if (state.from) return 'Since ' + fmtDate(state.from + 'T12:00');
  return 'Up to ' + fmtDate(state.to + 'T12:00');
}


// ---------------------------------------------------------------------------
// Teams
//
// A team is a label on a student and nothing more. No hour, session, average,
// chart bucket or review count is derived from it — those all come from the
// event log, which stores only student_id — so moving somebody between teams
// the night before competition changes what the totals are GROUPED BY and
// never what they are.
//
// "Unassigned" is deliberately not a team. It is the absence of one, written
// as an empty team_id, and it is what every student starts as and what they
// fall back to when a team is deleted. It has no row, cannot be renamed, and
// cannot be removed — so it is represented here by the empty string and given
// a name only at the point it is drawn.
// ---------------------------------------------------------------------------

const UNASSIGNED = '';

function teamById(teamId) {
  return state.teams.find((t) => t.team_id === teamId) || null;
}

/**
 * The team a student is actually on, as a key.
 *
 * A team_id pointing at a team that no longer exists reads as Unassigned. The
 * backend clears the column when it deletes a team, so this should not happen —
 * but a stale row must not vanish from every view because of a dangling id.
 */
function teamKeyOf(student) {
  const id = student && student.team_id ? String(student.team_id) : UNASSIGNED;
  return id && teamById(id) ? id : UNASSIGNED;
}

function teamName(teamId) {
  const team = teamById(teamId);
  return team ? team.name : 'Unassigned';
}

/** Every team key that gets a row in the stats table, Unassigned last. */
function teamKeys() {
  return state.teams.map((t) => t.team_id).concat([UNASSIGNED]);
}

function studentsOfTeam(teamId, { includeInactive = state.showInactive } = {}) {
  return state.students.filter((s) =>
    (includeInactive || s.active) && teamKeyOf(s) === teamId);
}

/** The single team-filter test. Every list view runs its rows through this. */
function matchesTeam(student) {
  if (state.teamFilter === 'all') return true;
  // A session whose student is not on the roster at all has no team, so it
  // belongs with the unassigned rather than showing up under every filter.
  const key = student ? teamKeyOf(student) : UNASSIGNED;
  if (state.teamFilter === 'unassigned') return key === UNASSIGNED;
  return key === state.teamFilter;
}

function matchesTeamId(studentId) {
  return matchesTeam(state.studentById.get(studentId));
}

/** Roll a team's students up into the same shape statsFor() returns, plus size. */
function teamStats(teamId) {
  const members = studentsOfTeam(teamId);
  const sessions = [];
  for (const member of members) sessions.push(...inRange(sessionsOf(member.student_id)));
  const st = statsFor(sessions);
  const active = members.filter((m) => m.active).length;
  return {
    teamId,
    name: teamName(teamId),
    members,
    size: members.length,
    activeSize: active,
    inLab: members.filter((m) => m.active && statsFor(sessionsOf(m.student_id)).open).length,
    ...st,
    // Hours per student is the number that makes two teams of different sizes
    // comparable, and it is the reason this table exists rather than a sort on
    // the timesheet. Divide by everyone on the team, including the people with
    // no hours — leaving them out would flatter a team that half showed up.
    perStudent: members.length ? st.totalMinutes / members.length : 0,
  };
}

/** The filter control shared by the roster, timesheet and both queues. */
function teamFilterHtml() {
  if (!state.teamsSupported) return '';
  const option = (value, label, count) =>
    `<option value="${esc(value)}" ${state.teamFilter === value ? 'selected' : ''}>` +
    `${esc(label)}${count == null ? '' : ` (${count})`}</option>`;

  return `
    <div class="control">
      <label class="control__label" for="team-filter">Team</label>
      <select class="input" id="team-filter" style="min-width:11rem">
        ${option('all', 'All teams', null)}
        ${state.teams.map((t) => option(t.team_id, t.name, studentsOfTeam(t.team_id).length)).join('')}
        ${option('unassigned', 'Unassigned', studentsOfTeam(UNASSIGNED).length)}
      </select>
    </div>`;
}

/** What the current team filter is showing, for a view's summary line. */
function teamLabel() {
  if (!state.teamsSupported || state.teamFilter === 'all') return 'All teams';
  if (state.teamFilter === 'unassigned') return 'Unassigned';
  return teamName(state.teamFilter);
}

/**
 * The timesheet's footer label. It used to read "Team total" back when there
 * was only one team; with a filter above it that word is now ambiguous, and a
 * footer that says "Team total" under a table filtered to Programming is
 * actively misleading about what it adds up.
 */
function totalLabel() {
  if (!state.teamsSupported || state.teamFilter === 'all') return 'Total — all teams';
  if (state.teamFilter === 'unassigned') return 'Total — unassigned';
  return 'Total — ' + teamName(state.teamFilter);
}

/** A small team label for a roster row or the detail heading. */
function teamPill(student) {
  const key = teamKeyOf(student);
  if (key === UNASSIGNED) return '<span class="muted">Unassigned</span>';
  return `<span class="pill pill--team">${esc(teamName(key))}</span>`;
}

// ---------------------------------------------------------------------------
// Loading
// ---------------------------------------------------------------------------

async function load() {
  state.summariesError = null;
  // Two calls, once. The roster carries students with no events at all (and the
  // active flag); the timesheet is fetched with NO date range so every view can
  // filter locally without going back to the network.
  //
  // Summaries are fetched separately and are allowed to fail. An Apps Script
  // deployment older than this page answers "unknown action: getSummaries",
  // and when that was fatal it locked a coach out of the roster and timesheet
  // entirely — over a feature they may not even be using. Now it degrades: the
  // hours still load and a banner says what is missing and why.
  // Both slim: this page draws four roster columns and formats its own times,
  // and it recomputes every statistic locally from the sessions below, so the
  // server's per-student stats blocks were built and shipped only to be
  // dropped on the floor. Asking for less also lets getRoster skip replaying
  // the event log entirely.
  // includeRejected: the backend leaves rejected sessions out of the log
  // entirely, which is what makes its totals right. This page needs them back
  // to show the Rejected hours queue, and splits them off below.
  const [roster, timesheet] = await Promise.all([
    api.admin.getRoster(state.pin, { slim: true }, { timeoutMs: 30000 }),
    api.admin.getTimesheet(state.pin, { slim: true, includeRejected: true }, { timeoutMs: 60000 }),
  ]);
  const summaries = await api.admin.getSummaries(state.pin, null, { timeoutMs: 60000 })
    .catch((err) => {
      state.summariesError = /unknown action/i.test(err.message)
        ? 'Summaries need a newer backend — redeploy the Apps Script Web App (Deploy → Manage deployments → edit → New version).'
        : 'Summaries could not be loaded: ' + err.message;
      return { summaries: [] };
    });

  state.students = roster.students.slice().sort((a, b) => a.name.localeCompare(b.name));
  state.studentById = new Map(state.students.map((s) => [s.student_id, s]));
  // An older deployment answers getRoster without a teams key at all. That is
  // not an error to shout about — it is a feature that is not there yet — so
  // the Teams tab explains the redeploy and every team control hides itself.
  state.teamsSupported = Array.isArray(roster.teams);
  state.teams = (roster.teams || []).slice().sort((a, b) => a.name.localeCompare(b.name));
  // THE split. Everything downstream reads state.sessions and can stay ignorant
  // of rejection; the Rejected hours view is the only reader of state.rejected.
  state.sessions = timesheet.sessions.filter((s) => s.event_status !== 'rejected');
  state.rejected = timesheet.sessions.filter((s) => s.event_status === 'rejected');
  state.gracePeriodHours = timesheet.grace_period_hours ?? 24;
  state.selectedRejected = new Set();
  state.byStudent = new Map();
  for (const s of state.sessions) {
    if (!state.byStudent.has(s.student_id)) state.byStudent.set(s.student_id, []);
    state.byStudent.get(s.student_id).push(s);
  }
  // Oldest first, so session lists and weekly buckets read chronologically.
  for (const list of state.byStudent.values()) {
    list.sort((a, b) => String(a.in_time || a.out_time).localeCompare(String(b.in_time || b.out_time)));
  }

  if (!state.summariesError) state.summariesError = null;
  state.summariesByStudent = new Map();
  for (const summary of summaries.summaries) {
    if (!state.summariesByStudent.has(summary.student_id)) state.summariesByStudent.set(summary.student_id, []);
    state.summariesByStudent.get(summary.student_id).push(summary);
  }
  state.loadedAt = new Date();
}

function showBanner(message) {
  $('banner-msg').textContent = message;
  $('banner').hidden = false;
}

async function refresh() {
  if (state.busy) return;
  state.busy = true;
  $('refresh').disabled = true;
  try {
    await load();
    $('banner').hidden = true;
  } catch (err) {
    showBanner(err.message);
  } finally {
    state.busy = false;
    $('refresh').disabled = false;
    render();
  }
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------

function render() {
  // Preserve the caret: the search box re-renders the table on every keystroke.
  const active = document.activeElement;
  const focusId = active && active.id ? active.id : null;
  const caret = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;

  $('freshness').textContent = state.loadedAt
    ? 'Updated ' + state.loadedAt.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
    : '';
  $('tab-roster').setAttribute('aria-selected', String(state.view === 'roster'));
  $('tab-teams').setAttribute('aria-selected', String(state.view === 'teams'));
  $('tab-timesheet').setAttribute('aria-selected', String(state.view === 'timesheet'));
  $('tab-flagged').setAttribute('aria-selected', String(state.view === 'flagged'));
  $('tab-rejected').setAttribute('aria-selected', String(state.view === 'rejected'));

  const flagged = flagCounts();
  $('flag-count').textContent = flagged.all;
  $('flag-count').hidden = flagged.all === 0;
  $('rejected-count').textContent = state.rejected.length;
  $('rejected-count').hidden = state.rejected.length === 0;

  if (state.summariesError) {
    $('banner-msg').textContent = state.summariesError;
    $('banner').hidden = false;
  }

  if (state.view === 'detail') $('view').innerHTML = detailHtml();
  else if (state.view === 'teams') $('view').innerHTML = teamsHtml();
  else if (state.view === 'timesheet') $('view').innerHTML = timesheetHtml();
  else if (state.view === 'flagged') $('view').innerHTML = flaggedHtml();
  else if (state.view === 'rejected') $('view').innerHTML = rejectedHtml();
  else $('view').innerHTML = rosterHtml();

  if (focusId && $(focusId)) {
    $(focusId).focus();
    if (caret != null) { try { $(focusId).setSelectionRange(caret, caret); } catch { /* not a text field */ } }
  }
  if (state.view === 'detail') wireChart();
  updateLive();
}

/** Update only the live counters, so typing is never interrupted by the timer. */
function updateLive() {
  for (const el of document.querySelectorAll('[data-since]')) {
    el.textContent = fmtDur(Math.max(0,
      Math.round((Date.now() - new Date(el.dataset.since).getTime()) / 60000)));
  }
}

function livePill(open) {
  if (!open) return '';
  return '<span class="pill pill--in"><span class="live-dot"></span> In now · ' +
         '<span data-since="' + esc(open.in_time) + '">' + fmtDur(openMinutes(open)) + '</span></span>';
}

// ---- Roster ---------------------------------------------------------------

function rosterHtml() {
  const term = state.search.trim().toLowerCase();
  const rows = state.students.filter((s) => {
    if (!state.showInactive && !s.active) return false;
    if (!matchesTeam(s)) return false;
    if (!term) return true;
    return s.name.toLowerCase().includes(term) || s.student_id.includes(term);
  });

  const body = rows.map((student) => {
    // "In the lab now" is a fact about right now, so it always looks at the
    // whole log — never at whatever date range the timesheet happens to have.
    const all = sessionsOf(student.student_id);
    const st = statsFor(all);
    // While the name is being edited the row must not be a link to the detail
    // view — a click in the text field would navigate away mid-edit.
    const renaming = state.renaming === student.student_id;
    const editingEmail = state.editingEmail === student.student_id;
    const editingTeam = state.editingTeam === student.student_id;
    // A row being edited must not also be a link to the detail view — a click
    // in the text field would navigate away mid-edit.
    const inline = renaming || editingEmail || editingTeam;
    return `
      <tr ${inline ? '' : `class="clickable" data-action="open" data-id="${esc(student.student_id)}"`}>
        <td class="name-cell">${renaming ? renameInputHtml(student) : `${esc(student.name)}
          ${student.active ? '' : ' <span class="pill pill--quiet">Archived</span>'}
          ${livePill(st.open)}`}</td>
        <td class="muted">${esc(student.grade || '—')}</td>
        ${state.teamsSupported
          ? `<td class="team-cell">${editingTeam ? teamSelectHtml(student) : teamPill(student)}</td>`
          : ''}
        <td class="email-cell">${editingEmail ? emailInputHtml(student) : emailCellHtml(student)}</td>
        <td class="num">${fmtHours(st.totalMinutes)}</td>
        <td class="num">${st.count}</td>
        <td class="muted">${fmtWhen(st.lastSeen)}</td>
        <td>${st.problems ? '<span class="pill pill--review">⚠ ' + st.problems + ' to review</span>' : ''}</td>
        <td><div class="row-actions">${
          renaming ? renameButtonsHtml(student)
          : editingEmail ? emailButtonsHtml(student)
          : editingTeam ? `<button class="btn btn--ghost btn-sm" data-action="team-cancel"
                  type="button">Cancel</button>`
          : `<button class="btn btn--ghost btn-sm" data-action="rename"
                  data-id="${esc(student.student_id)}">Rename</button>
          <button class="btn btn--ghost btn-sm" data-action="edit-email"
                  data-id="${esc(student.student_id)}">Email</button>
          ${state.teamsSupported ? `<button class="btn btn--ghost btn-sm" data-action="edit-team"
                  data-id="${esc(student.student_id)}">Team</button>` : ''}
          <button class="btn btn--ghost btn-sm" data-action="toggle-active"
                  data-id="${esc(student.student_id)}" data-active="${student.active}"
            >${student.active ? 'Archive' : 'Restore'}</button>`}</div></td>
      </tr>`;
  }).join('');

  const inLab = state.students.filter((s) => s.active && statsFor(sessionsOf(s.student_id)).open).length;

  return `
    <div class="controls">
      <div class="control">
        <label class="control__label" for="search">Search</label>
        <input class="input input--search" id="search" type="search" placeholder="Name or ID"
               value="${esc(state.search)}" autocomplete="off">
      </div>
      ${teamFilterHtml()}
      <div class="control">
        <label class="control__label" for="show-inactive">&nbsp;</label>
        <label class="row-gap" style="min-height:2.75rem">
          <input type="checkbox" id="show-inactive" ${state.showInactive ? 'checked' : ''}>
          <span>Show archived</span>
        </label>
      </div>
      <span class="topbar__spacer"></span>
      <button class="btn btn--primary btn-sm" data-action="show-add" type="button">Add student</button>
    </div>

    ${state.adding ? addFormHtml() : ''}

    <p class="muted" style="margin:0 0 0.75rem">
      ${rows.length} student${rows.length === 1 ? '' : 's'} shown ·
      <strong>${inLab}</strong> in the lab now
    </p>

    <div class="table-scroll">
      <table>
        <thead><tr>
          <th>Name</th><th>Grade</th>${state.teamsSupported ? '<th>Team</th>' : ''}
          <th>Email</th><th class="num">Hours</th><th class="num">Sessions</th>
          <th>Last seen</th><th>Review</th><th></th>
        </tr></thead>
        <tbody>${body || `<tr><td colspan="${state.teamsSupported ? 9 : 8}" class="empty">No students match.</td></tr>`}</tbody>
      </table>
    </div>`;
}

/**
 * The name field, shown in place of the name in the roster row or the detail
 * heading. The id is stable so render() can restore focus and caret position
 * on the re-renders the live-counter timer causes while a coach is typing.
 */
function renameInputHtml(student) {
  return `
    <input class="input" id="rename-input" maxlength="80" autocomplete="off"
           aria-label="Full name" value="${esc(student.name)}">
    <span class="muted" id="rename-msg"></span>`;
}

/**
 * The email cell. A student with no address is not a problem to flag — the
 * tablet lets them skip it on purpose — so a missing one reads as a quiet dash
 * rather than a warning.
 */
function emailCellHtml(student) {
  if (!student.email) return '<span class="muted">—</span>';
  return `<span class="email-cell__value" title="${esc(student.email)}">${esc(student.email)}</span>`;
}

/**
 * Inline editor, matching the rename control. The id is stable so render() can
 * restore focus and caret across the re-renders the live-counter timer causes
 * while a coach is typing.
 */
function emailInputHtml(student) {
  return `
    <input class="input" id="email-input" type="email" maxlength="120" autocomplete="off"
           inputmode="email" spellcheck="false" aria-label="Email address"
           placeholder="name@example.com" value="${esc(student.email || '')}">
    <span class="muted" id="email-msg"></span>`;
}

/**
 * The team picker, shown in place of the team pill in a roster row.
 *
 * It saves on change rather than behind a Save button: there is exactly one
 * field, no free text to typo and nothing to validate, so a second click would
 * only be ceremony. The id is stable so render() can restore focus across the
 * re-renders the live-counter timer causes.
 */
function teamSelectHtml(student) {
  const current = teamKeyOf(student);
  const option = (value, label) =>
    `<option value="${esc(value)}" ${current === value ? 'selected' : ''}>${esc(label)}</option>`;
  return `
    <select class="input" id="team-select" data-id="${esc(student.student_id)}"
            aria-label="Team" style="min-width:10rem">
      ${option(UNASSIGNED, 'Unassigned')}
      ${state.teams.map((t) => option(t.team_id, t.name)).join('')}
    </select>`;
}

function emailButtonsHtml(student) {
  return `
    <button class="btn btn--primary btn-sm" data-action="email-save"
            data-id="${esc(student.student_id)}" type="button">Save</button>
    <button class="btn btn--ghost btn-sm" data-action="email-cancel" type="button">Cancel</button>`;
}

function renameButtonsHtml(student) {
  return `
    <button class="btn btn--primary btn-sm" data-action="rename-save"
            data-id="${esc(student.student_id)}" type="button">Save</button>
    <button class="btn btn--ghost btn-sm" data-action="rename-cancel" type="button">Cancel</button>`;
}

function addFormHtml() {
  return `

// ---- Teams ----------------------------------------------------------------

function teamSortArrow(key) {
  if (state.teamSort.key !== key) return '';
  return state.teamSort.dir === 1 ? ' ↑' : ' ↓';
}

/** Every team's roll-up, in the order the header says. */
function teamRows() {
  const rows = teamKeys().map(teamStats);
  const { key, dir } = state.teamSort;
  const value = (r) => ({
    name: r.name.toLowerCase(),
    size: r.size,
    hours: r.totalMinutes,
    perStudent: r.perStudent,
    sessions: r.count,
    average: r.average ?? -1,
    review: r.problems,
  }[key]);

  return rows.sort((a, b) => {
    // Unassigned is a bucket, not a team, and it belongs at the bottom whatever
    // the sort — a coach comparing subteams is not comparing against it.
    if (a.teamId === UNASSIGNED) return 1;
    if (b.teamId === UNASSIGNED) return -1;
    const av = value(a), bv = value(b);
    if (av < bv) return -dir;
    if (av > bv) return dir;
    return a.name.localeCompare(b.name);
  });
}

/**
 * The hours cell, with the team's share of the largest team's hours drawn
 * behind the number.
 *
 * Anchored at zero and scaled to the biggest bar rather than to a round axis:
 * this is a ranking read across rows, not a value read off a scale, and the
 * number itself is right there in the cell for anyone who wants the quantity.
 */
function teamBarHtml(minutes, peak) {
  const pct = peak > 0 ? Math.round((minutes / peak) * 100) : 0;
  return `
    <div class="teambar">
      <div class="teambar__fill" style="width:${pct}%"></div>
      <span class="teambar__value">${fmtHours(minutes)}</span>
    </div>`;
}

  const body = rows.map((r) => {

    return `
    <tr class="${unassigned ? 'team-row--unassigned' : ''}">
      <td class="name-cell">${renaming

        : `${esc(r.name)}${unassigned
            ? ' <span class="muted" style="font-weight:400">· not a team</span>' : ''}
           ${r.inLab ? `<span class="pill pill--in"><span class="live-dot"></span> ${r.inLab} in now</span>` : ''}`}</td>
      <td class="num">${r.size}${r.size !== r.activeSize ? ` <span class="muted">(${r.activeSize} active)</span>` : ''}</td>

      <td class="num">${fmtHours(r.perStudent)}</td>
      <td class="num">${r.count}</td>
      <td class="num">${r.average == null ? '—' : fmtDur(r.average)}</td>
      <td class="num">${r.problems ? `<span class="pill pill--review">⚠ ${r.problems}</span>` : '<span class="muted">0</span>'}</td>
      <td><div class="row-actions">${
        renaming ? `
          <button class="btn btn--primary btn-sm" data-action="team-rename-save"
                  data-id="${esc(r.teamId)}" type="button">Save</button>
          <button class="btn btn--ghost btn-sm" data-action="team-rename-cancel" type="button">Cancel</button>`
        : confirming ? `
          <span class="muted">Members become Unassigned.</span>
          <button class="btn btn--ghost btn-sm btn-danger" data-action="team-delete-confirm"
                  data-id="${esc(r.teamId)}" type="button">Delete</button>
          <button class="btn btn--ghost btn-sm" data-action="team-delete-cancel" type="button">Cancel</button>`
        : `
          <button class="btn btn--ghost btn-sm" data-action="team-view"
                  data-id="${esc(unassigned ? 'unassigned' : r.teamId)}">Timesheet</button>
          ${unassigned ? '' : `
            <button class="btn btn--ghost btn-sm" data-action="team-rename"
                    data-id="${esc(r.teamId)}">Rename</button>
            <button class="btn btn--ghost btn-sm" data-action="team-delete"
                    data-id="${esc(r.teamId)}">Delete</button>`}`}</div></td>
    </tr>
    <tr class="team-row--members ${unassigned ? 'team-row--unassigned' : ''}">
      <td colspan="8">${r.members.length
        ? r.members.map((m) => `<button class="who-link" data-action="open"
              data-id="${esc(m.student_id)}">${esc(m.name)}${m.active ? '' : ' (archived)'}</button>`).join('')
        : '<span class="muted">Nobody on this team yet.</span>'}</td>
    </tr>`;
  }).join('');

  return `
    <div class="controls">
      <div class="control">
        <label class="control__label" for="from">From</label>
        <input class="input" id="from" type="date" value="${esc(state.from)}">
      </div>
      <div class="control">
        <label class="control__label" for="to">To</label>
        <input class="input" id="to" type="date" value="${esc(state.to)}">
      </div>
      <div class="control">
        <span class="control__label">Quick range</span>
        <div class="presets">
          <button class="btn btn--ghost btn-sm" data-action="preset" data-preset="all">All time</button>
          <button class="btn btn--ghost btn-sm" data-action="preset" data-preset="week">This week</button>
          <button class="btn btn--ghost btn-sm" data-action="preset" data-preset="30">Last 30 days</button>
          <button class="btn btn--ghost btn-sm" data-action="preset" data-preset="season">This season</button>
        </div>
      </div>
      <div class="control">
        <label class="control__label" for="show-inactive">&nbsp;</label>
        <label class="row-gap" style="min-height:2.75rem">
          <input type="checkbox" id="show-inactive" ${state.showInactive ? 'checked' : ''}>
          <span>Count archived</span>
        </label>
      </div>
      <span class="topbar__spacer"></span>
      <button class="btn btn--primary btn-sm" data-action="show-add-team" type="button">New team</button>
    </div>

    ${state.addingTeam ? `
      <div class="card add-form">
        <div class="control" style="flex:1;min-width:14rem">
          <label class="control__label" for="add-team-name">Team name</label>
          <input class="input" id="add-team-name" maxlength="60" autocomplete="off"
                 placeholder="e.g. Build, Programming, Business">
        </div>
        <button class="btn btn--primary btn-sm" data-action="add-team-save" type="button">Create team</button>
        <button class="btn btn--ghost btn-sm" data-action="add-team-cancel" type="button">Cancel</button>
        <span class="muted" id="add-team-msg"></span>
      </div>` : ''}

    <div class="tiles">
      <div class="tile"><div class="tile__label">Teams</div>
        <div class="tile__value">${state.teams.length}</div></div>

          <th class="sortable num" data-action="team-sort" data-key="average">Avg session${teamSortArrow('average')}</th>

}

/**
 * Bulk assignment: tick names, pick a team, save once.
 *
 * The roster's per-row picker is the right tool for moving one student. This is
 * the one for the start of a season, where the whole roster gets sorted in one
 * sitting — and it is one request and one column write on the server, not one
 * per student.
 */
function assignPanelHtml() {
  const term = state.assignSearch.trim().toLowerCase();
  const candidates = state.students.filter((s) => {
    if (!state.showInactive && !s.active) return false;
    if (!term) return true;
    return s.name.toLowerCase().includes(term) || s.student_id.includes(term);
  });
  const picked = state.selectedStudents.size;

  return `
    <div class="card" style="padding:1rem">
      <div class="row-gap" style="margin-bottom:0.75rem">
        <strong>Assign students to a team</strong>
        <span class="muted">Tick names, choose a team, save once.</span>
        <span style="flex:1"></span>
        <input class="input input--search" id="assign-search" type="search"
               placeholder="Filter names" value="${esc(state.assignSearch)}" autocomplete="off">
      </div>

      <div class="picker">
        ${candidates.map((s) => `
          <label class="picker__item ${state.selectedStudents.has(s.student_id) ? 'picker__item--on' : ''}">
            <input type="checkbox" data-action="pick-student" data-id="${esc(s.student_id)}"
                   ${state.selectedStudents.has(s.student_id) ? 'checked' : ''}>
            <span>${esc(s.name)}</span>
            <span class="muted picker__team">${esc(teamName(teamKeyOf(s)))}</span>

      <div class="row-gap" style="margin-top:0.85rem">
        <button class="btn btn--ghost btn-sm" data-action="pick-all">${

            ? 'Clear all' : 'Select all shown'}</button>
        <span class="muted">${picked} selected</span>
        <span style="flex:1"></span>
        <label class="control__label" for="assign-team">Move to</label>
        <select class="input" id="assign-team" style="min-width:11rem">
          <option value="" ${state.assignTeamId === '' ? 'selected' : ''}>Unassigned</option>
          ${state.teams.map((t) => `<option value="${esc(t.team_id)}"
            ${state.assignTeamId === t.team_id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}
        </select>
        <button class="btn btn--primary btn-sm" data-action="assign-save"
                ${picked ? '' : 'disabled'} type="button">Assign ${picked || ''}</button>
      </div>
    </div>`;
}

// ---- Timesheet ------------------------------------------------------------

function timesheetRows() {
  const term = state.search.trim().toLowerCase();
  const rows = [];
  for (const student of state.students) {
    if (!state.showInactive && !student.active) continue;
    if (!matchesTeam(student)) continue;
    if (term && !student.name.toLowerCase().includes(term) && !student.student_id.includes(term)) continue;
    const st = statsFor(inRange(sessionsOf(student.student_id)));
    rows.push({ student, st });
  }

  const { key, dir } = state.sort;
  const value = (r) => ({
    name: r.student.name.toLowerCase(),
    grade: r.student.grade || '',
    // Unassigned sorts after every named team rather than first on an empty
    // string, which is where a coach looks for it.
    team: teamKeyOf(r.student) === UNASSIGNED ? '\uffff' : teamName(teamKeyOf(r.student)).toLowerCase(),
    hours: r.st.totalMinutes,
    sessions: r.st.count,
    average: r.st.average ?? -1,
    last: r.st.lastSeen || '',
    review: r.st.problems,
  }[key]);

  return rows.sort((a, b) => {
    const av = value(a), bv = value(b);
    if (av < bv) return -dir;
    if (av > bv) return dir;
    return a.student.name.localeCompare(b.student.name);
  });
}

function sortArrow(key) {
  if (state.sort.key !== key) return '';
  return state.sort.dir === 1 ? ' ↑' : ' ↓';
}

function timesheetHtml() {
  const rows = timesheetRows();
  const totalMinutes = rows.reduce((sum, r) => sum + r.st.totalMinutes, 0);
  const totalSessions = rows.reduce((sum, r) => sum + r.st.count, 0);
  const totalReview = rows.reduce((sum, r) => sum + r.st.problems, 0);

  const body = rows.map(({ student, st }) => `
    <tr class="clickable" data-action="open" data-id="${esc(student.student_id)}">
      <td class="name-cell">${esc(student.name)}${student.active ? '' : ' <span class="pill pill--quiet">Archived</span>'}${livePill(st.open)}</td>
      <td class="muted">${esc(student.grade || '—')}</td>
      ${state.teamsSupported ? `<td>${teamPill(student)}</td>` : ''}
      <td class="num">${fmtHours(st.totalMinutes)}</td>
      <td class="num">${st.count}</td>
      <td class="num">${st.average == null ? '—' : fmtDur(st.average)}</td>
      <td class="muted">${fmtWhen(st.lastSeen)}</td>
      <td class="num">${st.problems ? '<span class="pill pill--review">⚠ ' + st.problems + '</span>' : '<span class="muted">0</span>'}</td>
    </tr>`).join('');

  return `
    <div class="controls">
      <div class="control">
        <label class="control__label" for="from">From</label>
        <input class="input" id="from" type="date" value="${esc(state.from)}">
      </div>
      <div class="control">
        <label class="control__label" for="to">To</label>
        <input class="input" id="to" type="date" value="${esc(state.to)}">
      </div>
      <div class="control">
        <span class="control__label">Quick range</span>
        <div class="presets">
          <button class="btn btn--ghost btn-sm" data-action="preset" data-preset="all">All time</button>
          <button class="btn btn--ghost btn-sm" data-action="preset" data-preset="week">This week</button>
          <button class="btn btn--ghost btn-sm" data-action="preset" data-preset="30">Last 30 days</button>
          <button class="btn btn--ghost btn-sm" data-action="preset" data-preset="season">This season</button>
        </div>
      </div>
      <div class="control">
        <label class="control__label" for="search">Search</label>
        <input class="input" id="search" type="search" placeholder="Name or ID" value="${esc(state.search)}" autocomplete="off">
      </div>
      ${teamFilterHtml()}
      <span class="topbar__spacer"></span>
      <button class="btn btn--ghost btn-sm" data-action="show-add-session" type="button">Add session</button>

/**
 * Sessions the grace-period job took out of the count, grouped by student.
 *
 * Grouped rather than listed flat because rejection happens in batches: the
 * nightly job takes out everyone who did not write up Saturday's build session
 * at once, and a flat list of forty rows makes it impossible to see that one
 * student accounts for eight of them.
 *
 * Like Needs review, this ignores the timesheet's date range on purpose. These
 * are hours a student has lost, and a filter that hides last month's is how
 * they stay lost.
 */
function rejectedGroups() {
  const term = state.search.trim().toLowerCase();
  const byStudent = new Map();
  for (const session of state.rejected) {
    if (!matchesTeamId(session.student_id)) continue;
    if (term && !String(session.name || '').toLowerCase().includes(term) &&
        !session.student_id.includes(term)) continue;
    if (!byStudent.has(session.student_id)) byStudent.set(session.student_id, []);
    byStudent.get(session.student_id).push(session);
  }
  const groups = [...byStudent.entries()].map(([studentId, sessions]) => ({
    studentId,
    name: sessions[0].name || studentId,
    sessions: sessions.slice().sort((a, b) =>
      String(b.in_time || b.out_time).localeCompare(String(a.in_time || a.out_time))),
    minutes: sessions.reduce((sum, x) => sum + (x.minutes || 0), 0),
  }));
  return groups.sort((a, b) => b.minutes - a.minutes || a.name.localeCompare(b.name));
}

/**
 * Why this session stopped counting. There is exactly one rule that rejects a
 * session, so this states it with the configured number rather than inventing
 * a per-row reason the backend does not record.
 */
function rejectReason(session) {
  const hours = state.gracePeriodHours;
  return `No summary submitted within ${hours}h of scanning out on ` +
         fmtDate(session.out_time || session.in_time);
}

/** Both event ids of a session — what recoverEvents needs to restore it. */
function sessionEventIds(session) {
  return [session.in_event_id, session.out_event_id].filter(Boolean);
}

function selectedRejectedMinutes() {

    if (state.selectedRejected.has(sessionKey(session))) total += session.minutes || 0;

}

/**
 * Put rejected sessions back into the count.
 *
 * Optimistic like every other write here: the rows move from state.rejected
 * into state.sessions immediately so the totals jump the moment the button is
 * pressed, and the server's rebuilt timeline replaces the guess when it lands.
 * Restoring an event can re-pair the sessions around it, which is why the
 * response carries whole timelines rather than a list of ids.
 */
function recoverSessions(sessions) {
  if (!sessions.length) return;
  const eventIds = [];
  for (const session of sessions) eventIds.push(...sessionEventIds(session));
  if (!eventIds.length) return;

  const keys = new Set(sessions.map(sessionKey));
  const affected = [...new Set(sessions.map((x) => x.student_id))];

  optimistic(
    () => {
      const beforeRejected = state.rejected.slice();
      const undoSessions = affected.map((studentId) => snapshotSessions(studentId));
      state.rejected = state.rejected.filter((x) => !keys.has(sessionKey(x)));
      for (const studentId of affected) {
        const restored = sessions
          .filter((x) => x.student_id === studentId)
          .map((x) => ({ ...x, event_status: 'recovered' }));
        setStudentSessions(studentId, (state.byStudent.get(studentId) || []).concat(restored));
      }
      for (const key of keys) state.selectedRejected.delete(key);
      return () => {
        state.rejected = beforeRejected;
        for (const undo of undoSessions) undo();
      };
    },
    () => api.admin.recoverEvents(state.pin, eventIds, { timeoutMs: 60000 }),
    (data) => {
      const byStudent = (data && data.sessions_by_student) || {};
      for (const studentId of Object.keys(byStudent)) {
        const all = byStudent[studentId];
        // The rebuilt timeline holds only what counts, which is exactly what
        // state.sessions is for. Anything of this student's still rejected
        // stays where it is, in state.rejected.
        setStudentSessions(studentId, all);
      }
    },
    sessions.length === 1 ? 'Could not recover that session'
                          : `Could not recover ${sessions.length} sessions`
  );
}

function rejectedByKey(key) {
  return state.rejected.find((x) => sessionKey(x) === key) || null;
}
