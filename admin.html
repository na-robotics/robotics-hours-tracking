/** Round an axis maximum up to a readable tick. */
function niceMax(value) {
  if (!(value > 0)) return 1;
  const pow = Math.pow(10, Math.floor(Math.log10(value)));
  for (const step of [1, 2, 2.5, 5, 10]) {
    if (value <= step * pow) return step * pow;
  }
  return 10 * pow;
}

/**
 * One series, so there is no legend — the heading names it — and only the peak
 * week is labelled directly rather than putting a number on every bar. Bars are
 * anchored to a zero baseline; a bar chart with a clipped axis lies about ratios.
 */
function chartHtml(weeks) {
  if (!weeks.length) return '<p class="empty">No completed sessions yet.</p>';

  const max = niceMax(Math.max(...weeks.map((w) => w.hours)));
  const peak = weeks.reduce((best, w) => (w.hours > best.hours ? w : best), weeks[0]);
  // Thin out x labels so they cannot collide at 30+ weeks.
  const every = Math.ceil(weeks.length / 12);

  const bars = weeks.map((w) => {
    const pct = (w.hours / max) * 100;
    const isPeak = w.key === peak.key && w.hours > 0;
    return `<div class="chart__col" data-week="${esc(w.label)}" data-hours="${w.hours.toFixed(1)}"
                 data-sessions="${w.sessions}" style="--h:${pct.toFixed(1)}%">
      ${isPeak ? `<span class="chart__peak">${w.hours.toFixed(1)}h</span>` : ''}
      <div class="chart__bar${w.hours ? '' : ' chart__bar--empty'}" style="height:${pct.toFixed(1)}%"></div>
    </div>`;
  }).join('');

  const ticks = weeks.map((w, i) =>
    `<div class="chart__tick">${i % every === 0 ? esc(w.label) : ''}</div>`).join('');

  const grid = [0, 0.5, 1].map((f) => `
    <div class="chart__gridline" style="top:${(100 - f * 100).toFixed(1)}%">
      <span class="chart__gridlabel">${(max * f).toFixed(max < 4 ? 1 : 0)}h</span>
    </div>`).join('');

  return `
    <div class="chart">
      <div class="chart__plot" id="chart-plot">
        <div class="chart__grid">${grid}</div>
        ${bars}
      </div>
      <div class="chart__axis">${ticks}</div>
      <div class="chart__tip" id="chart-tip" hidden></div>
    </div>`;
}

/** Per-bar hover tooltip. Hit target is the whole column, not just the bar. */
function wireChart() {
  const plot = $('chart-plot');
  const tip = $('chart-tip');
  if (!plot || !tip) return;

  plot.addEventListener('mousemove', (e) => {
    const col = e.target.closest('.chart__col');
    if (!col) { tip.hidden = true; return; }
    tip.innerHTML = `<strong>Week of ${esc(col.dataset.week)}</strong>` +
                    `${col.dataset.hours}h · ${col.dataset.sessions} session${col.dataset.sessions === '1' ? '' : 's'}`;
    tip.hidden = false;
    const bounds = plot.getBoundingClientRect();
    const x = e.clientX - bounds.left;
    tip.style.left = Math.min(Math.max(x + 12, 0), bounds.width - tip.offsetWidth) + 'px';
    tip.style.top = Math.max(0, e.clientY - bounds.top - tip.offsetHeight - 12) + 'px';
  });
  plot.addEventListener('mouseleave', () => { tip.hidden = true; });
}

/** Labels for a session that is not a clean in/out pair. */
const PROBLEM = {
  unclosed: { pill: 'review', text: 'No check-out', why: 'They scanned in and never scanned out, so this time cannot be counted. Correct the check-in time, or delete the stray check-in.' },
  orphan:   { pill: 'review', text: 'No check-in',  why: 'A check-out with nothing before it. Correct the check-out time, or delete the stray check-out.' },
  reversed: { pill: 'error',  text: 'Times reversed', why: 'The check-out is earlier than the check-in, so this session has no usable duration.' },
};

function sessionRowHtml(s, opts = {}) {
  const key = sessionKey(s);
  const problem = PROBLEM[s.status];
  const autoClosed = (s.sources || []).includes('auto-close');
  const offline = (s.sources || []).includes('offline');
  const manual = (s.sources || []).includes('manual');
  const recovered = s.event_status === 'recovered';

  let duration;
  if (s.status === 'closed') duration = fmtDur(s.minutes);
  else if (s.status === 'open') duration = `<span data-since="${esc(s.in_time)}">${fmtDur(openMinutes(s))}</span>`;
  else duration = '<span class="muted">—</span>';

  const marks = [
    s.status === 'open' ? '<span class="pill pill--in"><span class="live-dot"></span> In now</span>' : '',
    problem ? `<span class="pill pill--${problem.pill}" title="${esc(problem.why)}">⚠ ${problem.text}</span>` : '',
    autoClosed ? '<span class="pill pill--review">⏱ Auto-closed at lab close</span>' : '',
    offline ? '<span class="pill pill--review">📴 Offline replay</span>' : '',
    // Sits next to the auto-close pill on purpose: both mean "this time was not
    // measured by a scan", and a coach reading the timeline needs to see which.
    manual ? '<span class="pill pill--review">✍️ Added by a coach</span>' : '',
    recovered ? '<span class="pill pill--in">↩ Recovered by a late summary</span>' : '',
    !autoClosed && !offline && !manual && s.flagged
      ? '<span class="pill pill--review">⚑ Unverified time</span>' : '',
  ].filter(Boolean).join(' ');

  return `
    <div class="session${problem ? ' session--problem' : ''}">
      <div>
        <div class="session__date">${fmtDate(s.in_time || s.out_time)}</div>
        ${opts.showStudent ? `<button class="who-link" data-action="open" data-id="${esc(s.student_id)}"
            >${esc(s.name || s.student_id)}</button>` : ''}
      </div>
      <div class="session__times">
        ${s.in_time ? fmtTime(s.in_time) : '<span class="muted">—</span>'}
        →
        ${s.out_time ? fmtTime(s.out_time) : (s.status === 'open' ? 'still here' : '<span class="muted">—</span>')}
        ${marks ? '<div style="margin-top:0.35rem">' + marks + '</div>' : ''}
      </div>
      <div class="session__dur">${duration}</div>
      <div class="session__actions">
        <button class="btn btn--ghost btn-sm" data-action="edit" data-key="${esc(key)}">Edit</button>
        <button class="btn btn--ghost btn-sm" data-action="ask-delete" data-key="${esc(key)}">Delete</button>
      </div>
      ${state.editing === key ? editorHtml(s) : ''}
      ${state.confirming === key ? confirmHtml(s) : ''}
    </div>`;
}

function summaryRowHtml(summary) {
  // Namespaced so a summary and a session can never collide in state.confirming.
  const key = 'summary:' + summary.summary_id;
  const photos = (summary.photo_urls || []).map((url) => {
    const id = driveId(url);
    const full = id ? 'https://drive.google.com/file/d/' + id + '/view' : url;
    const thumb = id ? 'https://drive.google.com/thumbnail?id=' + id + '&sz=w400' : url;
    // Drive can refuse to serve an image cross-origin; degrade to a link rather
    // than leaving a broken-image icon on the page.
    return `<a class="summary__photo" href="${esc(full)}" target="_blank" rel="noopener" title="Open full size">
      <img src="${esc(thumb)}" alt="Photo from ${esc(summary.session_date)}" loading="lazy"
           onerror="this.parentNode.classList.add('summary__photo--broken');this.parentNode.textContent='Open photo in Drive';">
    </a>`;
  }).join('');

  return `
    <div class="summary">
      <div class="summary__head">
        <span class="summary__label">SUMMARY</span>
        <span class="session__date">${fmtDate(summary.session_date + 'T12:00')}</span>
        <span class="muted" style="font-size:0.8125rem">submitted ${fmtWhen(summary.submitted_at)}</span>
        <span style="flex:1"></span>
        <button class="btn btn--ghost btn-sm" data-action="ask-delete-summary"
                data-key="${esc(key)}">Delete</button>
      </div>
      <p class="summary__text">${esc(summary.text)}</p>
      ${photos ? `<div class="summary__photos">${photos}</div>` : ''}
      ${state.confirming === key ? `
        <div class="confirm" style="margin-top:0.75rem">
          <strong>Delete this summary?</strong>
          <span class="muted">It stops showing anywhere${summary.photo_urls.length
            ? ` and ${summary.photo_urls.length} photo${summary.photo_urls.length === 1 ? '' : 's'} move to the Drive trash, recoverable for 30 days`
            : ''}. The original row stays in the sheet for the record.</span>
          <div class="confirm__actions">
            <button class="btn btn--ghost btn-sm" data-action="cancel-delete">Cancel</button>
            <button class="btn btn-danger btn-sm" data-action="confirm-delete-summary"
                    data-key="${esc(key)}">Yes, delete</button>
          </div>
        </div>` : ''}

}

function editorHtml(s) {
  return `
    <div class="session__editor">
      ${s.in_event_id ? `
        <div class="control">
          <label class="control__label" for="edit-in">Check-in</label>
          <input class="input" id="edit-in" type="datetime-local" value="${esc(toLocalInput(s.in_time))}">
        </div>` : '<p class="muted" style="margin:0">This session has no check-in event to edit.</p>'}
      ${s.out_event_id ? `
        <div class="control">
          <label class="control__label" for="edit-out">Check-out</label>
          <input class="input" id="edit-out" type="datetime-local" value="${esc(toLocalInput(s.out_time))}">
        </div>` : ''}
      <div class="control" style="flex:1;min-width:14rem">
        <label class="control__label" for="edit-reason">Reason (saved in the log)</label>
        <input class="input" id="edit-reason" placeholder="e.g. forgot to scan out" autocomplete="off">
      </div>
      <button class="btn btn--primary btn-sm" data-action="save-edit" data-key="${esc(sessionKey(s))}">Save</button>
      <button class="btn btn--ghost btn-sm" data-action="cancel-edit">Cancel</button>
      <p class="muted" style="flex-basis:100%;margin:0;font-size:0.8125rem">
        Corrections are appended to the log, never written over the original. The corrected
        time is hand-entered, so it will show as unverified.
      </p>
    </div>`;
}

function confirmHtml(s) {
  const count = [s.in_event_id, s.out_event_id].filter(Boolean).length;
  return `
    <div class="confirm">
      <strong>Delete this session?</strong>
      <span class="muted">${count === 2 ? 'Both the check-in and check-out' : 'The one event'} will be voided.
        The original rows stay in the sheet for audit, and the time stops counting.</span>
      <div class="confirm__actions">
        <button class="btn btn--ghost btn-sm" data-action="cancel-delete">Cancel</button>
        <button class="btn btn-danger btn-sm" data-action="confirm-delete" data-key="${esc(sessionKey(s))}">Yes, delete</button>
      </div>
    </div>`;
}

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------

function findSession(key) {
  return state.sessions.find((s) => sessionKey(s) === key) || null;
}

async function withBusy(fn) {
  if (state.busy) return;
  state.busy = true;
  try {
    await fn();
    $('banner').hidden = true;
  } catch (err) {
    showBanner(err instanceof ApiError ? err.message : String(err));
  } finally {
    state.busy = false;
  }
}

// ---------------------------------------------------------------------------
// Optimistic writes
//
// Every one of these actions used to be: send the mutation, wait, then re-fetch
// the roster, the whole timesheet and every summary, wait again, then re-render.
// Four serial round-trips to Apps Script to rename a student — about five
// seconds of a dead-looking page for a change we could already predict.
//
// Now the local state changes first and the page re-renders on the spot; the
// request goes out behind it. Three rules keep that honest:
//
//   1. Every apply() returns its own undo. If the request fails the undo runs,
//      the row snaps back, and a toast says what did not save. Silent rollback
//      would be worse than the wait it replaced.
//   2. The server's answer wins. Each mutation returns the record it wrote, and
//      reconcile() patches it over the guess. Where the two can legitimately
//      differ — superseding a check-in can re-pair the sessions around it — the
//      server is the one that knows, and this is where the guess is corrected.
//   3. Nothing here re-fetches. If a handler cannot patch state from what came
//      back, that is a reason to return more from the endpoint, not to reload.
// ---------------------------------------------------------------------------

let savingCount = 0;

function renderSaving() {
  $('saving').hidden = savingCount === 0;
}

/**
 * Show a failure without stealing focus or blocking anything. The banner is
 * for "the page could not load"; this is for "that one change did not stick",
 * which has to be dismissible and must not move the layout under a cursor.
 */
function toast(message) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="toast__msg">${esc(message)}</span>` +
    `<button class="toast__close" type="button" aria-label="Dismiss">&times;</button>`;
  el.querySelector('.toast__close').addEventListener('click', () => el.remove());
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 8000);
}

/**
 * Apply a change locally, render, and send it in the background.
 *
 * @param {() => (() => void)} apply  mutate state now; return the rollback
 * @param {() => Promise<any>} send   the request
 * @param {(data: any) => void} [reconcile]  patch state with the server's record
 * @param {string} whatFailed  named in the toast if the write is rejected
 */
function optimistic(apply, send, reconcile, whatFailed) {
  const rollback = apply();
  render();

  savingCount += 1;
  renderSaving();

  send()
    .then((data) => {
      if (reconcile) reconcile(data);
      $('banner').hidden = true;
      render();
    })
    .catch((err) => {
      rollback();
      render();
      toast(whatFailed + ' — ' + (err instanceof ApiError ? err.message : String(err)));
    })
    .finally(() => {
      savingCount -= 1;
      renderSaving();
    });
}

/** Replace one student's sessions everywhere they are indexed. */
function setStudentSessions(studentId, sessions) {
  const sorted = sessions.slice().sort((a, b) =>
    String(a.in_time || a.out_time).localeCompare(String(b.in_time || b.out_time)));
  state.byStudent.set(studentId, sorted);
  state.sessions = state.sessions.filter((s) => s.student_id !== studentId).concat(sorted);
}

/** Snapshot a student's sessions so a failed edit can put them back exactly. */
function snapshotSessions(studentId) {
  const before = (state.byStudent.get(studentId) || []).slice();
  return () => setStudentSessions(studentId, before);
}

/**
 * Save a correction. Each changed end of the session is a separate append —
 * editEvent supersedes one event id at a time — so a session with both ends
 * moved costs two calls, and the second still targets a valid id because
 * superseding the check-in does not touch the check-out.
 */
async function saveEdit(key) {
  const session = findSession(key);
  if (!session) return;
  const reason = ($('edit-reason')?.value || '').trim();
  const jobs = [];

  const inEl = $('edit-in');
  if (inEl && session.in_event_id && inEl.value) {
    const next = new Date(inEl.value).toISOString();
    if (Math.abs(new Date(next) - new Date(session.in_time)) >= 60000) {
      jobs.push([session.in_event_id, next]);
    }
  }
  const outEl = $('edit-out');
  if (outEl && session.out_event_id && outEl.value) {
    const next = new Date(outEl.value).toISOString();
    if (Math.abs(new Date(next) - new Date(session.out_time)) >= 60000) {
      jobs.push([session.out_event_id, next]);
    }
  }

  if (!jobs.length) { state.editing = null; render(); return; }

  const studentId = session.student_id;
  state.editing = null;

  optimistic(
    () => {
      // Predict the obvious part: the times the coach just typed. The pairing
      // of events into sessions is the server's call — if this edit moves a
      // check-in past a neighbouring check-out the sessions re-pair, and
      // reconcile() below replaces this guess with the real timeline.
      const undo = snapshotSessions(studentId);
      const live = (state.byStudent.get(studentId) || []).map((s) => {
        if (sessionKey(s) !== key) return s;
        const next = { ...s };
        for (const [eventId, timestamp] of jobs) {
          if (eventId === s.in_event_id) next.in_time = timestamp;
          if (eventId === s.out_event_id) next.out_time = timestamp;
        }
        next.minutes = next.in_time && next.out_time && next.status === 'closed'
          ? Math.max(0, Math.round((new Date(next.out_time) - new Date(next.in_time)) / 60000))
          : next.minutes;
        next.flagged = true;            // a hand-entered time is unverified, as on the server
        return next;
      });
      setStudentSessions(studentId, live);
      return undo;
    },
    async () => {
      // Still serial: editEvent supersedes one event id at a time, and the
      // second call has to target an id the first did not replace. The
      // difference is that nobody is watching a frozen page while it runs.
      let last = null;
      for (const [eventId, timestamp] of jobs) {
        last = await api.admin.editEvent(state.pin, eventId, { timestamp, reason });
      }
      return last;
    },
    (data) => { if (data && data.sessions) setStudentSessions(studentId, data.sessions); },
    'Could not save the correction'
  );
}

/**
 * Anyone with the site URL can post a summary under any student's ID, so a
 * coach needs a way to take one down. Appends a tombstone and trashes the
 * photos; nothing is edited or hard-deleted.
 */
async function deleteSummary(key) {
  const summaryId = key.replace(/^summary:/, '');
  state.confirming = null;

  optimistic(
    () => {
      // Find it first: the rollback has to restore it at its original index.
      let owner = null, index = -1, removed = null;
      for (const [studentId, list] of state.summariesByStudent) {
        const at = list.findIndex((x) => String(x.summary_id) === summaryId);
        if (at >= 0) { owner = studentId; index = at; removed = list[at]; break; }
      }
      if (!owner) return () => {};
      state.summariesByStudent.get(owner).splice(index, 1);
      return () => { state.summariesByStudent.get(owner).splice(index, 0, removed); };
    },
    () => api.admin.deleteSummary(state.pin, summaryId, 'deleted from the admin page', { timeoutMs: 60000 }),
    null,
    'Could not delete the summary'
  );
}

async function deleteSession(key) {
  const session = findSession(key);
  if (!session) return;
  const ids = [session.in_event_id, session.out_event_id].filter(Boolean);
  const studentId = session.student_id;
  state.confirming = null;

  optimistic(
    () => {
      const undo = snapshotSessions(studentId);
      setStudentSessions(studentId,
        (state.byStudent.get(studentId) || []).filter((s) => sessionKey(s) !== key));
      return undo;
    },
    async () => {
      let last = null;
      for (const id of ids) {
        last = await api.admin.deleteEvent(state.pin, id, 'deleted from the admin page');
      }
      return last;
    },
    // Voiding one end of a session can leave the other end as an orphan or an
    // unclosed session rather than removing the row outright, so take the
    // server's rebuilt timeline over the row we just hid.
    (data) => { if (data && data.sessions) setStudentSessions(studentId, data.sessions); },
    'Could not delete the session'
  );
}

async function addStudent() {
  const id = ($('add-id')?.value || '').trim();
  const name = ($('add-name')?.value || '').trim();
  const grade = ($('add-grade')?.value || '').trim();
  const email = ($('add-email')?.value || '').trim();
  const msg = $('add-msg');

  if (!/^\d{7}$/.test(id)) { msg.textContent = 'The ID must be exactly 7 digits.'; return; }
  if (name.length < 2) { msg.textContent = 'Enter a full name.'; return; }
  if (email && !looksLikeEmail(email)) { msg.textContent = 'That email does not look right.'; return; }

  // The one write that is NOT optimistic. enroll is the duplicate-ID check —
  // showing a student on the roster and then yanking them back out because the
  // ID was already taken is worse than a moment's wait on the form that is
  // already showing "Saving…". It still patches instead of re-fetching.
  msg.textContent = 'Saving…';
  await withBusy(async () => {
    const created = await api.enroll(id, name, grade, email);
    // team_id starts blank: enrollment does not put anyone on a team, and the
    // roster picker or the Teams tab is where that happens.
    const student = {
      student_id: created.student_id, name: created.name,
      grade: created.grade, active: created.active, email: created.email || '',
      team_id: '',
    };
    state.students.push(student);
    state.studentById.set(student.student_id, student);
    state.students.sort((a, b) => a.name.localeCompare(b.name));
    state.adding = false;
  });
  render();
}

/**
 * Fix a spelling, or record the name a student actually goes by. Only the
 * roster row changes: Events keys off student_id alone, so every hour, session
 * and summary already on file follows the student across the rename.
 */
async function saveRename(studentId) {
  const student = state.students.find((s) => s.student_id === studentId);
  const name = ($('rename-input')?.value || '').trim();
  const msg = $('rename-msg');

  if (name.length < 2) { if (msg) msg.textContent = 'Enter a full name.'; return; }
  if (!student || name === student.name) { state.renaming = null; render(); return; }

  state.renaming = null;
  const previous = student.name;

  optimistic(
    () => {
      student.name = name;
      state.students.sort((a, b) => a.name.localeCompare(b.name));
      // Sessions carry a denormalised copy of the name for the timesheet's
      // student column, so it has to move too or the rename half-lands.
      for (const s of state.sessions) if (s.student_id === studentId) s.name = name;
      return () => {
        student.name = previous;
        state.students.sort((a, b) => a.name.localeCompare(b.name));
        for (const s of state.sessions) if (s.student_id === studentId) s.name = previous;
      };
    },
    () => api.admin.setName(state.pin, studentId, name),
    (data) => { if (data && data.student) Object.assign(student, data.student); },
    `Could not rename ${previous}`
  );
}

/**
 * Same loose shape the tablet and the backend use. The only thing worth
 * catching client-side is a typo like "sam@gmail" or a name in the wrong box.
 */
const looksLikeEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);

/**
 * Add or correct an email after enrollment.
 *
 * The tablet lets a student skip the field in one tap, which is the right
 * trade at a kiosk with a queue — so most addresses arrive here instead, from a
 * coach with a roster in front of them. Clearing it (an empty box) is a valid
 * save: it stops the scan-out emails for a student who asked not to get them.
 *
 * Like the rename, this only touches roster data. Events key off student_id
 * alone, so no hour or session moves.
 */
async function saveEmail(studentId) {
  const student = state.students.find((x) => x.student_id === studentId);
  const email = ($('email-input')?.value || '').trim();
  const msg = $('email-msg');

  if (email && !looksLikeEmail(email)) {
    if (msg) msg.textContent = 'That does not look like an email address.';
    return;
  }
  if (!student || email === (student.email || '')) { state.editingEmail = null; render(); return; }

  state.editingEmail = null;
  const previous = student.email || '';

  optimistic(
    () => {
      student.email = email;
      return () => { student.email = previous; };
    },
    () => api.admin.setEmail(state.pin, studentId, email),
    (data) => { if (data && data.student) Object.assign(student, data.student); },
    `Could not save the email for ${student.name}`
  );
}

// ---------------------------------------------------------------------------
// Team writes
//
// All of these are pure roster edits. No event is written, no session moves and
// no total changes — only what the totals are grouped by — so the optimistic
// rollbacks here have nothing to put back but a label.
// ---------------------------------------------------------------------------

function sortTeams(teams) {
  return teams.slice().sort((a, b) => a.name.localeCompare(b.name));
}

/** Move one student, from the roster's inline picker. */
function saveStudentTeam(studentId, teamId) {
  const student = state.studentById.get(studentId);
  state.editingTeam = null;
  if (!student || (student.team_id || '') === teamId) { render(); return; }

  const previous = student.team_id || '';
  optimistic(
    () => {
      student.team_id = teamId;
      return () => { student.team_id = previous; };
    },
    () => api.admin.setTeam(state.pin, studentId, teamId),
    (data) => {
      const record = data && data.students && data.students[0];
      if (record) Object.assign(student, record);
    },
    `Could not move ${student.name} to ${teamName(teamId)}`
  );
}

/**
 * Create a team. NOT optimistic, unlike the rest of this page: the team_id is
 * minted by the server, and every other control here — the filter, the pickers,
 * the assign panel — keys off it. Inventing a placeholder id and swapping it
 * out underneath a coach who has already started ticking names is a worse
 * second than the one it saves.
 */
async function createTeam() {
  const name = ($('add-team-name')?.value || '').trim();
  const msg = $('add-team-msg');
  if (name.length < 2) { if (msg) msg.textContent = 'Enter a team name.'; return; }
  if (state.teams.some((t) => t.name.toLowerCase() === name.toLowerCase())) {
    if (msg) msg.textContent = 'There is already a team with that name.';
    return;
  }
  if (msg) msg.textContent = 'Creating…';

  savingCount += 1;
  renderSaving();
  try {
    const data = await api.admin.createTeam(state.pin, name);
    state.teams = sortTeams(data.teams || []);
    state.addingTeam = false;
    // Preselect it in the assigner: creating a team is almost always the first
    // half of "…and now put these nine people on it".
    if (data.team) state.assignTeamId = data.team.team_id;
    render();
  } catch (err) {
    const box = $('add-team-msg');
    const text = err instanceof ApiError ? err.message : String(err);
    if (box) box.textContent = text; else toast('Could not create the team — ' + text);
  } finally {
    savingCount -= 1;
    renderSaving();
  }
}

/** Rename a team. One cell on the server; members carry the id, so nobody moves. */
function saveTeamRename(teamId) {
  const team = teamById(teamId);
  const name = ($('team-name-input')?.value || '').trim();
  if (!team) { state.renamingTeam = null; render(); return; }
  if (name.length < 2 || name === team.name) { state.renamingTeam = null; render(); return; }
  if (state.teams.some((t) => t.team_id !== teamId && t.name.toLowerCase() === name.toLowerCase())) {
    toast('There is already a team called "' + name + '".');
    return;
  }

  state.renamingTeam = null;
  const previous = team.name;
  optimistic(
    () => {
      team.name = name;
      state.teams = sortTeams(state.teams);
      return () => { team.name = previous; state.teams = sortTeams(state.teams); };
    },
    () => api.admin.renameTeam(state.pin, teamId, name),
    (data) => { if (data && data.teams) state.teams = sortTeams(data.teams); },
    `Could not rename ${previous}`
  );
}

/**
 * Delete a team. Its members become Unassigned — the server clears the column
 * inside the same lock, and this mirrors that locally so no row is left
 * pointing at a team that is gone.
 */
function deleteTeam(teamId) {
  const team = teamById(teamId);
  state.confirmingTeam = null;
  if (!team) { render(); return; }

  const members = studentsOfTeam(teamId, { includeInactive: true });
  const previousTeams = state.teams.slice();
  const wasFiltered = state.teamFilter === teamId;

  optimistic(
    () => {
      state.teams = state.teams.filter((t) => t.team_id !== teamId);
      for (const member of members) member.team_id = '';
      if (wasFiltered) state.teamFilter = 'all';
      if (state.assignTeamId === teamId) state.assignTeamId = '';
      return () => {
        state.teams = previousTeams;
        for (const member of members) member.team_id = teamId;
        if (wasFiltered) state.teamFilter = teamId;
      };
    },
    () => api.admin.deleteTeam(state.pin, teamId),
    (data) => { if (data && data.teams) state.teams = sortTeams(data.teams); },
    `Could not delete ${team.name}`
  );
}

/** The bulk assigner: everyone ticked moves in one request. */
function assignSelected() {
  const ids = [...state.selectedStudents].filter((id) => state.studentById.has(id));
  if (!ids.length) return;
  const teamId = state.assignTeamId || '';
  const previous = new Map(ids.map((id) => [id, state.studentById.get(id).team_id || '']));

  optimistic(
    () => {
      for (const id of ids) state.studentById.get(id).team_id = teamId;
      state.selectedStudents = new Set();
      return () => {
        for (const id of ids) state.studentById.get(id).team_id = previous.get(id);
        state.selectedStudents = new Set(ids);
      };
    },
    () => api.admin.setTeam(state.pin, ids, teamId),
    (data) => {
      for (const record of (data && data.students) || []) {
        const student = state.studentById.get(record.student_id);
        if (student) Object.assign(student, record);
      }
    },
    `Could not move ${ids.length} student${ids.length === 1 ? '' : 's'} to ${teamName(teamId)}`
  );
}

/**
 * Write a whole session by hand.
 *
 * NOT optimistic, unlike everything else on this page. The server owns the
 * three checks that make this safe — end after start, no overlap with a
 * session the student already has, under max_session_minutes — and only it can
 * see the whole log. Painting a session onto the timesheet and then yanking it
 * back out because it collided with a scan the coach forgot about is worse
 * than the second it takes to ask.
 */
async function addManualSession() {
  const studentId = $('ms-student')?.value || '';
  const date = ($('ms-date')?.value || '').trim();
  const start = ($('ms-start')?.value || '').trim();
  const end = ($('ms-end')?.value || '').trim();
  const reason = ($('ms-reason')?.value || '').trim();
  const msg = $('ms-msg');

  if (!studentId) { msg.textContent = 'Pick a student.'; return; }
  if (!date) { msg.textContent = 'Pick a date.'; return; }
  if (!start || !end) { msg.textContent = 'Enter both a start and an end time.'; return; }
  if (end <= start) { msg.textContent = 'The end time must be after the start time.'; return; }

  if (state.busy) return;
  state.busy = true;
  msg.textContent = 'Saving…';
  try {
    const created = await api.admin.addManualSession(state.pin, studentId,
      { date, start, end, reason }, { timeoutMs: 30000 });
    // The server hands back the student's whole rebuilt timeline, so there is
    // nothing to re-fetch and nothing to guess about how the new pair sits
    // among the scans already on file.
    if (created.sessions) setStudentSessions(studentId, created.sessions);
    state.addingSession = false;
    state.busy = false;
    render();
    toast(`Added ${fmtDur(created.minutes)} for ${created.name} on ${created.date}.`);
    return;
  } catch (err) {
    // Inline, not in the banner: the overlap and ceiling messages name the
    // exact session that collided, and a coach needs to read that next to the
    // times they typed so they can change them.
    state.busy = false;
    render();
    if ($('ms-msg')) $('ms-msg').textContent = err instanceof ApiError ? err.message : String(err);
  }
}

async function toggleActive(studentId, currentlyActive) {
  const student = state.students.find((s) => s.student_id === studentId);
  if (!student) return;
  const next = !currentlyActive;

  optimistic(
    () => {
      student.active = next;
      return () => { student.active = currentlyActive; };
    },
    () => api.admin.setActive(state.pin, studentId, next),
    (data) => { if (data && data.student) Object.assign(student, data.student); },
    `Could not ${next ? 'restore' : 'archive'} ${student.name}`
  );
}

function applyPreset(preset) {
  const today = new Date();
  if (preset === 'all') { state.from = ''; state.to = ''; return; }
  if (preset === 'week') {
    state.from = dateKey(weekStart(today));
    state.to = dateKey(today);
    return;
  }
  if (preset === '30') {
    const start = new Date(today);
    start.setDate(start.getDate() - 29);
    state.from = dateKey(start);
    state.to = dateKey(today);
    return;
  }
  if (preset === 'season') {
    // A robotics season starts in the autumn; before August, use last year's.
    const year = today.getMonth() >= 7 ? today.getFullYear() : today.getFullYear() - 1;
    state.from = year + '-08-01';
    state.to = dateKey(today);
  }
}

// ---------------------------------------------------------------------------
// CSV export — built in the browser, exactly the rows on screen
// ---------------------------------------------------------------------------

/**
 * A leading =, +, - or @ makes a spreadsheet treat the cell as a formula when
 * the file is reopened, so those values get a leading apostrophe.
 */
function csvCell(value) {
  let text = value == null ? '' : String(value);
  if (/^[=+\-@]/.test(text)) text = "'" + text;
  return /[",\n\r]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
}

function exportCsv() {
  const rows = timesheetRows();
  const header = ['student_id', 'name', 'grade', 'team', 'email', 'active', 'total_hours', 'total_minutes',
                  'sessions', 'avg_session_minutes', 'longest_minutes', 'shortest_minutes',
                  'sessions_per_week', 'last_seen', 'sessions_needing_review'];

  const lines = [header.join(',')];
  for (const { student, st } of rows) {
    lines.push([
      student.student_id, student.name, student.grade,
      teamKeyOf(student) === UNASSIGNED ? '' : teamName(teamKeyOf(student)),
      student.email || '', student.active,
      fmtHours(st.totalMinutes), st.totalMinutes, st.count,
      st.average ?? '', st.longest ?? '', st.shortest ?? '', st.perWeek ?? '',
      st.lastSeen ? new Date(st.lastSeen).toLocaleString() : '', st.problems,
    ].map(csvCell).join(','));
  }

  const range = state.from || state.to ? (state.from || 'start') + '_to_' + (state.to || 'today') : 'all-time';
  // Name the file after what is actually in it: a CSV filtered to one team and
  // called lab-hours_all-time.csv is the kind of thing that gets emailed to a
  // sponsor as the whole team's numbers.
  const scope = state.teamFilter === 'all' ? '' : '_' + teamLabel().toLowerCase().replace(/[^a-z0-9]+/g, '-');
  // ﻿ so Excel opens it as UTF-8 and does not mangle accented names.
  const blob = new Blob(['﻿' + lines.join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'lab-hours_' + range + scope + '.csv';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ---------------------------------------------------------------------------
// Event wiring
// ---------------------------------------------------------------------------

$('view').addEventListener('click', (event) => {
  const el = event.target.closest('[data-action]');
  if (!el) return;
  const { action, id, key, active, preset } = el.dataset;

  switch (action) {
    case 'open':        state.view = 'detail'; state.detailId = id; state.editing = null;
                        state.confirming = null; state.renaming = null; state.editingEmail = null;
                        render(); window.scrollTo(0, 0); break;
    case 'back':        state.view = 'roster'; state.detailId = null; state.renaming = null;
                        state.editingEmail = null; render(); break;
    case 'toggle-active': toggleActive(id, active === 'true'); break;
    case 'rename':      state.renaming = id; state.editing = null; state.confirming = null;
                        render(); $('rename-input')?.select(); break;
    case 'rename-save': saveRename(id); break;
    case 'rename-cancel': state.renaming = null; render(); break;
    case 'edit-email':  state.editingEmail = id; state.renaming = null; state.editing = null;
                        state.confirming = null; render(); $('email-input')?.select(); break;
    case 'email-save':  saveEmail(id); break;
    case 'email-cancel': state.editingEmail = null; render(); break;
    case 'edit-team':   state.editingTeam = id; state.renaming = null; state.editingEmail = null;
                        state.editing = null; state.confirming = null;
                        render(); $('team-select')?.focus(); break;
    case 'team-cancel': state.editingTeam = null; render(); break;
    case 'show-add':    state.adding = true; render(); $('add-id')?.focus(); break;
    case 'add-cancel':  state.adding = false; render(); break;
    case 'add-save':    addStudent(); break;
    case 'show-add-session': state.addingSession = true; render(); $('ms-student')?.focus(); break;
    case 'add-session-cancel': state.addingSession = false; render(); break;
    case 'add-session-save': addManualSession(); break;
    case 'sort':        state.sort = state.sort.key === el.dataset.key
                          ? { key: el.dataset.key, dir: -state.sort.dir }
                          : { key: el.dataset.key, dir: el.dataset.key === 'name' ? 1 : -1 };
                        render(); break;
    case 'preset':      applyPreset(preset); render(); break;
    // --- teams ---
    case 'team-sort':   state.teamSort = state.teamSort.key === el.dataset.key
                          ? { key: el.dataset.key, dir: -state.teamSort.dir }
                          : { key: el.dataset.key, dir: el.dataset.key === 'name' ? 1 : -1 };
                        render(); break;
    case 'team-view':   state.teamFilter = id; goto('timesheet'); break;
    case 'show-add-team': state.addingTeam = true; render(); $('add-team-name')?.focus(); break;
    case 'add-team-cancel': state.addingTeam = false; render(); break;
    case 'add-team-save': createTeam(); break;
    case 'team-rename': state.renamingTeam = id; state.confirmingTeam = null;
                        render(); $('team-name-input')?.select(); break;
    case 'team-rename-save': saveTeamRename(id); break;
    case 'team-rename-cancel': state.renamingTeam = null; render(); break;
    case 'team-delete': state.confirmingTeam = id; state.renamingTeam = null; render(); break;
    case 'team-delete-cancel': state.confirmingTeam = null; render(); break;
    case 'team-delete-confirm': deleteTeam(id); break;
    // Checkboxes here rather than in the input listener, so a click on the
    // label and a click on the box take the same path.
    case 'pick-student':
      if (state.selectedStudents.has(id)) state.selectedStudents.delete(id);
      else state.selectedStudents.add(id);
      render(); break;
    case 'pick-all': {
      const term = state.assignSearch.trim().toLowerCase();
      const shown = state.students.filter((x) =>
        (state.showInactive || x.active) &&
        (!term || x.name.toLowerCase().includes(term) || x.student_id.includes(term)));
      const allTicked = shown.length && shown.every((x) => state.selectedStudents.has(x.student_id));
      for (const student of shown) {
        if (allTicked) state.selectedStudents.delete(student.student_id);
        else state.selectedStudents.add(student.student_id);
      }
      render(); break;
    }
    case 'assign-save': assignSelected(); break;
    case 'flag-filter': state.flagFilter = el.dataset.filter; render(); break;
    case 'export':      exportCsv(); break;
    case 'edit':        state.editing = state.editing === key ? null : key;
                        state.confirming = null; render(); break;
    case 'cancel-edit': state.editing = null; render(); break;
    case 'save-edit':   saveEdit(key); break;
    case 'ask-delete':  state.confirming = key; state.editing = null; render(); break;
    case 'ask-delete-summary': state.confirming = key; state.editing = null; render(); break;
    case 'confirm-delete-summary': deleteSummary(key); break;
    case 'cancel-delete': state.confirming = null; render(); break;
    case 'confirm-delete': deleteSession(key); break;
    case 'recover': {
      const session = rejectedByKey(key);
      if (session) recoverSessions([session]);
      break;
    }
    case 'recover-group': {
      recoverSessions(state.rejected.filter((x) => x.student_id === id));
      break;
    }
    case 'recover-selected':
      recoverSessions(state.rejected.filter((x) => state.selectedRejected.has(sessionKey(x))));
      break;
    case 'clear-selection': state.selectedRejected.clear(); render(); break;
    // Checkboxes are handled here rather than in the input listener below so a
    // click on the label or the box takes the same path.
    case 'select-rejected':
      if (state.selectedRejected.has(key)) state.selectedRejected.delete(key);
      else state.selectedRejected.add(key);
      render(); break;
    case 'select-group': {
      const group = state.rejected.filter((x) => x.student_id === id);
      const allTicked = group.every((x) => state.selectedRejected.has(sessionKey(x)));
      for (const session of group) {
        if (allTicked) state.selectedRejected.delete(sessionKey(session));
        else state.selectedRejected.add(sessionKey(session));
      }
      render(); break;
    }
  }
});

$('view').addEventListener('keydown', (event) => {
  if (event.target.id === 'rename-input') {
    if (event.key === 'Enter') { event.preventDefault(); saveRename(state.renaming); }
    else if (event.key === 'Escape') { state.renaming = null; render(); }
  } else if (event.target.id === 'email-input') {
    if (event.key === 'Enter') { event.preventDefault(); saveEmail(state.editingEmail); }
    else if (event.key === 'Escape') { state.editingEmail = null; render(); }
  } else if (event.target.id === 'team-name-input') {
    if (event.key === 'Enter') { event.preventDefault(); saveTeamRename(state.renamingTeam); }
    else if (event.key === 'Escape') { state.renamingTeam = null; render(); }
  } else if (event.target.id === 'add-team-name') {
    if (event.key === 'Enter') { event.preventDefault(); createTeam(); }
    else if (event.key === 'Escape') { state.addingTeam = false; render(); }
  } else if (event.target.id === 'team-select') {
    if (event.key === 'Escape') { state.editingTeam = null; render(); }
  }
});

$('view').addEventListener('input', (event) => {
  const el = event.target;
  if (el.id === 'search') { state.search = el.value; render(); }
  else if (el.id === 'from') { state.from = el.value; render(); }
  else if (el.id === 'to') { state.to = el.value; render(); }
  else if (el.id === 'show-inactive') { state.showInactive = el.checked; render(); }
  else if (el.id === 'team-filter') { state.teamFilter = el.value; render(); }
  // One field, nothing to validate: the picker saves the moment it changes.
  else if (el.id === 'team-select') { saveStudentTeam(el.dataset.id, el.value); }
  else if (el.id === 'assign-team') { state.assignTeamId = el.value; render(); }
  else if (el.id === 'assign-search') { state.assignSearch = el.value; render(); }
});

/** Leaving a view abandons whatever inline editor was open in it. */
function goto(view) {
  state.view = view;
  state.detailId = null;
  state.renaming = null;
  state.editingEmail = null;
  state.editingTeam = null;
  state.renamingTeam = null;
  state.addingTeam = false;
  state.confirmingTeam = null;
  state.editing = null;
  state.confirming = null;
  render();
}

$('tab-roster').addEventListener('click', () => goto('roster'));
$('tab-teams').addEventListener('click', () => goto('teams'));
$('tab-timesheet').addEventListener('click', () => goto('timesheet'));
$('tab-flagged').addEventListener('click', () => goto('flagged'));
$('tab-rejected').addEventListener('click', () => goto('rejected'));
$('refresh').addEventListener('click', refresh);
$('banner-retry').addEventListener('click', refresh);
$('lock').addEventListener('click', () => {
  sessionStorage.removeItem('lab.admin.pin');
  location.reload();
});

// ---------------------------------------------------------------------------
// PIN gate
//
// The PIN is checked by making a real admin call: the backend compares it with
// the Config tab and rejects anything else, so there is no separate "verify"
// endpoint to keep in sync. It is held in sessionStorage, which dies with the
// tab — a coach's laptop keeps it across a refresh but not across a restart.
// ---------------------------------------------------------------------------

async function unlock(pin) {
  const msg = $('gate-msg');
  msg.textContent = 'Checking…';
  $('unlock').disabled = true;
  state.pin = pin;
  try {
    await load();
    sessionStorage.setItem('lab.admin.pin', pin);
    $('gate').hidden = true;
    $('app').hidden = false;
    render();
  } catch (err) {
    state.pin = '';
    sessionStorage.removeItem('lab.admin.pin');
    msg.textContent = err instanceof ApiError ? err.message : String(err);
    $('gate').hidden = false;
    $('app').hidden = true;
    $('pin').value = '';
    $('pin').focus();
  } finally {
    $('unlock').disabled = false;
  }
}

$('unlock').addEventListener('click', () => unlock($('pin').value.trim()));
$('pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock($('pin').value.trim()); });

// Live counters tick without re-rendering, so they never steal focus.
setInterval(updateLive, 30000);

if (state.pin) unlock(state.pin);
else $('pin').focus();
</script>
